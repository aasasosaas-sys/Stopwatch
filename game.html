<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>勉強クエスト</title>
<style>
:root{
  --bg:#fff;--fg:#000;--sub:#8e8e93;--card:#f2f2f7;--line:#d1d1d6;
  --acc:#ff9500;--go:#1f9d3a;--go-bg:#d9f2df;--stop:#e5362b;--stop-bg:#fde2df;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--fg:#fff;--card:#1c1c1e;--line:#2c2c2e;--acc:#ff9f0a;--go:#30d158;--go-bg:#0c2a14;--stop:#ff453a;--stop-bg:#3a100d}
}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,"SF Pro Display","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 24px}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-height:62vh;border-radius:18px;overflow:hidden;background:#8fd3ff;
  box-shadow:0 1px 0 rgba(0,0,0,.04)}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:10px 14px;color:#fff;font-weight:800;font-size:clamp(12px,2.6vw,18px);letter-spacing:.04em;
  text-shadow:0 2px 0 rgba(30,20,60,.55);pointer-events:none;font-variant-numeric:tabular-nums}
.hud small{display:block;font-size:.72em;font-weight:700;opacity:.95}
.hud .r{text-align:right}
.coin{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#ffd23f;box-shadow:inset -2px -2px 0 #e0a412,0 2px 0 rgba(30,20,60,.55);vertical-align:-.05em;margin-right:.25em}
.banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:#fff;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s}
.banner.on{opacity:1}
.banner b{font-size:clamp(26px,7vw,56px);font-weight:900;letter-spacing:.06em;
  text-shadow:0 4px 0 #c2410c,0 8px 18px rgba(0,0,0,.25);transform:scale(.6);transition:transform .6s cubic-bezier(.2,1.6,.4,1)}
.banner.on b{transform:none}
.banner span{font-weight:800;font-size:clamp(13px,2.8vw,18px);text-shadow:0 2px 0 rgba(30,20,60,.55)}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(20,16,40,.62);color:#fff;
  padding:8px 14px;border-radius:999px;font-size:clamp(12px,2.6vw,15px);font-weight:600;white-space:nowrap;transition:opacity .4s;pointer-events:none}
.hint.off{opacity:0}

.panel{display:grid;grid-template-columns:1fr auto;gap:14px 18px;align-items:center;margin-top:16px}
.tt{font-size:clamp(40px,11vw,72px);font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.lbl{color:var(--sub);font-size:14px;margin-bottom:4px}
.cir{width:96px;height:96px;border-radius:50%;font-size:18px;font-weight:500;background:var(--go-bg);color:var(--go);transition:transform .15s,background .25s,color .25s}
.cir.stop{background:var(--stop-bg);color:var(--stop)}
.cir:active{transform:scale(.95)}
.cir:disabled{opacity:.4}
.prog{grid-column:1/-1}
.bar{position:relative;height:10px;border-radius:99px;background:var(--card);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#5ccf4f,#ffb020);border-radius:99px;width:0}
.ticks{display:flex;justify-content:space-between;color:var(--sub);font-size:11px;margin-top:4px;font-variant-numeric:tabular-nums}
.meta{display:flex;justify-content:space-between;font-size:15px;margin-top:10px}
.meta b{font-weight:600}
.map{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px}
.map h3{margin:0 0 10px;font-size:15px;font-weight:600}
.map h3 span{color:var(--sub);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.w{display:flex;flex-direction:column;gap:3px;align-items:center}
.w i{display:block;width:100%;aspect-ratio:1;border-radius:4px;background:var(--card);position:relative;overflow:hidden}
.w i.cur{outline:2px solid var(--acc);outline-offset:1px}
.w i u{position:absolute;left:0;bottom:0;right:0;background:#5ccf4f}
.w i.done{background:#5ccf4f}
.w em{font-style:normal;color:var(--sub);font-size:11px;margin-top:2px}
.dev{grid-column:1/-1;color:var(--sub);font-size:14px;border-top:1px solid var(--line);padding-top:12px}
.dev summary{cursor:pointer}
.dev .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.pill{background:var(--card);border-radius:999px;padding:8px 16px;font-size:14px}
.pill.on{background:var(--acc);color:#fff}
.dev p{margin:8px 0 0;font-size:13px;line-height:1.5}
@media (max-width:520px){.cir{width:84px;height:84px;font-size:17px}.grid{gap:4px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div>WORLD 1-1<small>はじまりの草原</small></div>
      <div><span class="coin"></span>×<span id="hc">0</span></div>
      <div class="r">のこり<small id="hl" style="font-size:1em">10:00</small></div>
    </div>
    <div class="hint" id="hint">「開始」を押して勉強スタート。キャラが自動で進みます</div>
    <div class="banner" id="ban"><b>STAGE CLEAR!</b><span id="bans"></span></div>
  </div>

  <div class="panel">
    <div>
      <div class="lbl">今日の勉強時間</div>
      <div class="tt" id="tt">0:00</div>
    </div>
    <button class="cir" id="go">開始</button>
    <div class="prog">
      <div class="bar"><i id="pb"></i></div>
      <div class="ticks"><span>0分</span><span>2分</span><span>4分</span><span>6分</span><span>8分</span><span>10分</span></div>
      <div class="meta"><span>ステージ 1-1</span><b id="pt">0%</b></div>
    </div>
    <div class="map">
      <h3>全72ステージ <span>· 1ステージ10分 · 12時間でオールクリア</span></h3>
      <div class="grid" id="grid"></div>
    </div>
    <details class="dev">
      <summary>確認用（早送り・リセット）</summary>
      <div class="row">
        <span>速度</span>
        <button class="pill" data-m="1">×1</button>
        <button class="pill" data-m="10">×10</button>
        <button class="pill" data-m="60">×60</button>
        <button class="pill" id="rs" style="margin-left:auto">リセット</button>
      </div>
      <p>早送り中は勉強時間も速く進みます。評価用の機能です。</p>
    </details>
  </div>
</div>

<script>
(() => {
'use strict';
const T = 16, VH = 192, STAGE = 600, HEAD = 27;
const cv = document.getElementById('cv'), c = cv.getContext('2d');
const $ = id => document.getElementById(id);

/* ---------- seeded random ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };

/* ---------- level generation ----------
   The whole stage is a pure function of study seconds s (0..600).
   The generator lays out terrain and, together with it, the exact path
   (runs + jumps) the hero takes, so the auto-play never fails. */
function build(seed){
  const R = rng(seed), ri = (a,b) => a + Math.floor(R()*(b-a+1)), pick = a => a[Math.floor(R()*a.length)];
  const G = [], segs = [], coins = [], blocks = [], enemies = [], stumps = [], plats = [], decos = [];
  const TARGET = 1350;
  let col = 0, h = 2, px = 2*T, hp = 2*T;

  const flat = (n, deco = true) => {
    for (let i = 0; i < n; i++, col++) {
      G[col] = h;
      if (deco && R() < .42) decos.push({x: col*T + ri(2,14), y: h*T, k: pick(['f','f','f','g','g','g','b','b','r','t','t','fe'])});
    }
  };
  const runTo = x => { if (x > px + .01) { segs.push({j:0, x0:px, x1:x, h0:hp, h1:hp}); px = x; } };
  const jump = (x0, x1, h1, A, k) => {
    x0 = Math.max(x0, px); runTo(x0);
    const s = {j:1, x0, x1, h0:hp, h1, A, k}; segs.push(s); px = x1; hp = h1; return s;
  };
  const arcY = (s,u) => s.h0 + (s.h1 - s.h0)*u + 4*s.A*u*(1-u);
  const arcCoins = (s, n) => { for (let i = 1; i <= n; i++) { const u = i/(n+1); coins.push({x: s.x0 + (s.x1-s.x0)*u, y: arcY(s,u) + 12}); } };

  const F = {
    pit(d){
      const w = ri(2, d > .45 ? 5 : 3);
      const x0 = col*T - 3, x1 = (col+w)*T + 6;
      for (let i = 0; i < w; i++) G[col+i] = 0;
      col += w;
      const s = jump(x0, x1, hp, 20 + w*6);
      if (R() < .65) arcCoins(s, w + 1);
      flat(ri(2,4));
    },
    enemy(){
      const c0 = col; flat(9);
      const xm = (c0+3)*T + 8;
      jump(xm - 34, xm, hp + 9, 16, 'e');
      jump(xm, xm + 46, h*T, 26);
      enemies.push({xm, y: h*T, range: (c0+8.5)*T - xm});
    },
    enemy2(){
      const c0 = col; flat(15);
      const a = (c0+3)*T + 8, b = (c0+9)*T + 8;
      jump(a - 34, a, hp + 9, 16, 'e'); jump(a, a + 46, h*T, 26);
      jump(b - 34, b, hp + 9, 16, 'e'); jump(b, b + 46, h*T, 26);
      enemies.push({xm: a, y: h*T, range: (c0+6.5)*T - a});
      enemies.push({xm: b, y: h*T, range: (c0+14.5)*T - b});
    },
    block(){
      const c0 = col; flat(7);
      const b = c0 + 3, bx = b*T + 8, by = h*T + 3*T;
      blocks.push({x: b*T, y: by, q: 1, hx: bx});
      if (R() < .6) { blocks.push({x:(b-1)*T, y:by, q:0}); blocks.push({x:(b+1)*T, y:by, q:0}); }
      if (R() < .5) for (let i = 0; i < 3; i++) coins.push({x:(b-1+i)*T + 8, y: by + T + 8, sky: 1});
      jump(bx - 30, bx + 30, hp, 3*T - HEAD, 'b');
    },
    stump(d){
      const k = ri(1, d > .35 ? 3 : 2);
      flat(2);
      stumps.push({col, k, h});
      G[col] = h; G[col+1] = h; col += 2;
      const s = jump((col-2)*T - 22, col*T + 22, hp, k*T*1.25 + 14);
      if (R() < .4) arcCoins(s, 3);
      flat(ri(2,3));
    },
    stairs(){
      const n = ri(2,3);
      flat(1);
      for (let i = 0; i < n && h < 6; i++) { h++; jump(col*T - 12, col*T + 10, h*T, 16); flat(2, false); }
      for (let i = 0; i < 3; i++) coins.push({x:(col+i)*T + 8, y: h*T + 12});
      flat(2, false);
      while (h > 2) { h--; jump(col*T - 2, col*T + 14, h*T, 8); flat(2, false); }
      flat(2);
    },
    height(){
      if (h < 4 && R() < .55) { flat(1); h++; jump(col*T - 12, col*T + 10, h*T, 16); flat(ri(3,5)); }
      else if (h > 2) { h--; jump(col*T - 2, col*T + 14, h*T, 8); flat(ri(3,5)); }
      else flat(4);
    },
    plats(){
      const c0 = col, w = 10;
      for (let i = 0; i < w; i++) G[col+i] = 0;
      const y1 = Math.min(h + ri(1,2), 6), y2 = Math.min(h + ri(1,3), 7);
      plats.push({x:(c0+2)*T, w:3*T, y:y1*T}); plats.push({x:(c0+6)*T, w:3*T, y:y2*T});
      jump(c0*T - 3, (c0+2)*T + 8, y1*T, 22);
      for (let i = 0; i < 2; i++) coins.push({x:(c0+3+i)*T + 2, y: y1*T + 12});
      runTo((c0+5)*T - 6);
      const s = jump((c0+5)*T - 6, (c0+6)*T + 8, y2*T, 20);
      arcCoins(s, 1);
      runTo((c0+9)*T - 6);
      jump((c0+9)*T - 6, (c0+w)*T + 8, h*T, 18);
      col += w; flat(3);
    },
    coins(){
      const c0 = col; flat(6);
      for (let i = 0; i < 4; i++) coins.push({x:(c0+1+i)*T + 8, y: h*T + 12});
    },
    rest(){ flat(ri(3,6)); }
  };
  const W = [['pit',5],['enemy',4],['enemy2',1.5],['block',3.5],['stump',3],['stairs',1.2],['height',2],['plats',1.4],['coins',1.5],['rest',2]];
  const total = W.reduce((a,b) => a + b[1], 0);

  flat(10);
  decos.push({x: 4*T, y: h*T, k: 'start'});
  let last = '';
  while (col < TARGET) {
    const d = col / TARGET;
    let r = R()*total, k = 'rest';
    for (const [n,w] of W) { if ((r -= w) < 0) { k = n; break; } }
    if (k === last && k !== 'pit') continue;
    if ((k === 'plats' || k === 'enemy2' || k === 'stairs') && d < .12) continue;
    last = k; F[k](d);
  }
  while (h > 2) { h--; jump(col*T - 2, col*T + 14, h*T, 8); flat(3, false); }
  flat(5, false);
  const goalX = (col + 1)*T + 8;
  flat(22, false);
  runTo(goalX);
  const houseX = (col - 14)*T;

  /* timing: jumps take a physically plausible time, runs share the rest */
  let runLen = 0, jt = 0;
  for (const s of segs) {
    if (s.j) { s.d = .26 + .072*Math.sqrt(s.A) + .0028*(s.x1 - s.x0); jt += s.d; }
    else runLen += s.x1 - s.x0;
  }
  const V = runLen / (STAGE - jt);
  let t = 0;
  for (const s of segs) { if (!s.j) s.d = (s.x1 - s.x0)/V; s.t0 = t; t += s.d; }

  return {G, segs, coins, blocks, enemies, stumps, plats, decos, goalX, houseX, V, endCol: col};
}

const L = build(20261121);
const segs = L.segs;

function segAtX(x){ let lo = 0, hi = segs.length - 1; while (lo < hi) { const m = (lo+hi+1) >> 1; if (segs[m].x0 <= x) lo = m; else hi = m - 1; } return segs[lo]; }
function segAtT(s){ let lo = 0, hi = segs.length - 1; while (lo < hi) { const m = (lo+hi+1) >> 1; if (segs[m].t0 <= s) lo = m; else hi = m - 1; } return segs[lo]; }
function timeAt(x){ const g = segAtX(x); return g.t0 + Math.max(0, Math.min(1, (x - g.x0)/(g.x1 - g.x0)))*g.d; }
function heroAt(s){
  s = Math.max(0, Math.min(STAGE, s));
  const g = segAtT(s), u = Math.min(1, (s - g.t0)/g.d), x = g.x0 + (g.x1 - g.x0)*u;
  if (!g.j) return {x, y: g.h0, air: false, g, u};
  return {x, y: g.h0 + (g.h1 - g.h0)*u + 4*g.A*u*(1-u), air: true, g, u, vy: (g.h1 - g.h0) + 4*g.A*(1-2*u)};
}
for (const o of L.coins) o.t = timeAt(o.x);
for (const o of L.blocks) if (o.q) o.t = timeAt(o.hx);
for (const o of L.enemies) o.t = timeAt(o.xm);
const landings = segs.filter(s => s.j && s.k !== 'e').map(s => ({x: s.x1, y: s.h1, t: s.t0 + s.d}));
L.coins.sort((a,b) => a.t - b.t);
const coinTimes = L.blocks.filter(b => b.q).map(b => b.t).concat(L.coins.map(o => o.t)).sort((a,b) => a - b);
const TOTAL_COINS = coinTimes.length;
const coinsAt = s => { let n = 0; for (const t of coinTimes) { if (t <= s) n++; else break; } return n; };
const minuteSigns = [];
for (let m = 1; m <= 9; m++) {
  let x = heroAt(m*60).x, cl = Math.floor(x/T);
  for (let k = 0; k < 12 && (!L.G[cl] || L.stumps.some(st => cl === st.col || cl === st.col + 1)); k++) cl++;
  x = cl*T + 8; minuteSigns.push({x, y: L.G[cl]*T, m});
}

/* ---------- study clock ---------- */
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); };
const fresh = () => ({d: today(), acc: 0, run: false, t0: 0, mult: 1, stopAt: Date.now(), winAt: 0});
let st;
try { st = JSON.parse(localStorage.getItem('quest-day')); } catch (e) {}
if (!st || st.d !== today()) st = fresh();
st.mult = st.mult || 1;
const save = () => { try { localStorage.setItem('quest-day', JSON.stringify(st)); } catch (e) {} };
const studyMs = () => st.acc + (st.run ? (Date.now() - st.t0)*st.mult : 0);
const commit = () => { if (st.run) { const n = Date.now(); st.acc += (n - st.t0)*st.mult; st.t0 = n; } };

let wake = null;
const lockWake = async () => { try { if (st.run && navigator.wakeLock && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen'); } catch (e) {} };
document.addEventListener('visibilitychange', lockWake);

function toggle(){
  if (st.run) { commit(); st.run = false; st.stopAt = Date.now(); if (wake) { wake.release().catch(()=>{}); wake = null; } }
  else { if (studyMs() >= STAGE*1000) return; st.run = true; st.t0 = Date.now(); lockWake(); }
  save(); ui();
}
$('go').onclick = toggle;
document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { commit(); st.mult = +b.dataset.m; save(); ui(); });
$('rs').onclick = () => { if (confirm('今日の記録とステージ1-1をリセットしますか？')) { st = fresh(); save(); ui(); } };
window.__quest = { L: () => L, set(sec){ st.acc = sec*1000; st.t0 = Date.now(); st.winAt = 0; save(); ui(); } };

/* ---------- map grid ---------- */
const grid = $('grid');
grid.innerHTML = Array.from({length: 12}, (_, w) => `<div class="w">${Array.from({length: 6}, (_, i) => `<i data-s="${w*6+i}"><u></u></i>`).join('')}<em>${w+1}</em></div>`).join('');
const cells = [...grid.querySelectorAll('i')];

const fmt = ms => { const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s/60)%60, x = s%60; return h + ':' + String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0'); };
const fmtShort = s => { s = Math.ceil(s); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };

function ui(){
  const ms = studyMs(), s = Math.min(STAGE, ms/1000), p = s/STAGE;
  $('tt').textContent = ms < 3600000 ? fmt(ms).slice(2) : fmt(ms);
  $('go').textContent = st.run ? '停止' : (s >= STAGE ? 'クリア' : '開始');
  $('go').className = 'cir' + (st.run ? ' stop' : '');
  $('go').disabled = !st.run && s >= STAGE;
  $('pb').style.width = (p*100) + '%';
  $('pt').textContent = Math.floor(p*100) + '%';
  $('hl').textContent = fmtShort(STAGE - s);
  $('hc').textContent = coinsAt(s);
  $('hint').classList.toggle('off', st.run || ms > 0);
  document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', +b.dataset.m === st.mult));
  cells.forEach((el, i) => {
    const f = i === 0 ? p : 0;
    el.classList.toggle('done', f >= 1);
    el.classList.toggle('cur', i === 0 && f < 1);
    el.firstChild.style.height = (f < 1 ? f*100 : 0) + '%';
  });
}

/* ---------- drawing ---------- */
let SC = 1, VW = 320, dpr = 1;
function resize(){
  const r = cv.getBoundingClientRect(); dpr = Math.min(3, devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(r.width*dpr)); cv.height = Math.max(1, Math.round(r.height*dpr));
  SC = cv.height / VH; VW = cv.width / SC;
}
addEventListener('resize', resize);

const OL = '#2b2340';
const lerp = (a,b,t) => a + (b-a)*t;
const mix = (a,b,t) => { const pa = a.match(/\w\w/g).map(x => parseInt(x,16)), pb = b.match(/\w\w/g).map(x => parseInt(x,16)); return 'rgb(' + pa.map((v,i) => Math.round(lerp(v,pb[i],t))).join(',') + ')'; };
const rr = (x,y,w,h,r) => { c.beginPath(); c.roundRect ? c.roundRect(x,y,w,h,r) : c.rect(x,y,w,h); };
const Y = wy => VH - wy;

function drawSky(p, now){
  const top = p < .6 ? mix('#5cb8ff','#4aa3f5',p/.6) : mix('#4aa3f5','#ff9b6a',(p-.6)/.4);
  const bot = p < .6 ? mix('#cdeeff','#bfe7ff',p/.6) : mix('#bfe7ff','#ffe0a3',(p-.6)/.4);
  const g = c.createLinearGradient(0,0,0,VH); g.addColorStop(0,top); g.addColorStop(1,bot);
  c.fillStyle = g; c.fillRect(0,0,VW,VH);

    const k = age/.4, x = l.x - cam, y = Y(l.y);
    puff(x - 4 - k*8, y - 1 - k*2, 2.5*(1 - k) + 1, .8*(1 - k));
    puff(x + 4 + k*6, y - 1 - k*2, 2.2*(1 - k) + 1, .8*(1 - k));
  }
  // running dust
  if (!hero.air) {
    const step = 34, k0 = Math.floor(hero.x/step);
    for (let k = k0; k > k0 - 3; k--) {
      const dx = k*step, age = s - timeAt(dx); if (age < 0 || age > .35) continue;
      const hy = heroAt(timeAt(dx)); if (hy.air) continue;
      puff(dx - cam - 4 - age*10, Y(hy.y) - 1.5 - age*6, 1.8*(1 - age/.35) + .5, .7*(1 - age/.35));
    }
  }
}

const HC = '#ff5a2e';
function stick(P, col){
  // P: {hip:[x,y], neck:[x,y], head:[x,y], legs:[[knee,foot],[knee,foot]], arms:[[elbow,hand],[elbow,hand]]}
  const line = pts => { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.stroke(); };
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (const pass of [0, 1]) {
    const w = pass ? 2.5 : 3.9;
    c.strokeStyle = pass ? col : 'rgba(43,35,64,.85)';
    // back limbs a bit darker
    c.lineWidth = w;
    if (pass) c.strokeStyle = shade(col);
    line([P.hip, P.legs[1][0], P.legs[1][1]]);
    line([P.neck, P.arms[1][0], P.arms[1][1]]);
    if (pass) c.strokeStyle = col;
    line([P.hip, P.neck]);
    line([P.hip, P.legs[0][0], P.legs[0][1]]);
    line([P.neck, P.arms[0][0], P.arms[0][1]]);
    c.fillStyle = pass ? col : 'rgba(43,35,64,.85)';
    c.beginPath(); c.arc(P.head[0], P.head[1], pass ? 4.6 : 5.3, 0, 7); c.fill();
  }
}
const shadeCache = {};
function shade(col){ return shadeCache[col] || (shadeCache[col] = mix(col.slice(1), '8a2a14', .35)); }
const pt = (o, a, l) => [o[0] + Math.sin(a)*l, o[1] + Math.cos(a)*l];
function pose(o){
  // angles: 0 = straight down, positive = forward (+x)
  const t = o.t; let hipY = -11.6, lean = 0, L = [[0, .1], [0, .1]], A = [[.15, .5], [-.15, .5]], headOff = 0;
  if (o.mode === 'run') {
    const p = o.ph; lean = .22;
    hipY = -10.4 - 1.3*Math.abs(Math.cos(p));
    for (let i = 0; i < 2; i++) { const q = p + i*Math.PI; L[i] = [.9*Math.sin(q), .25 + 1.4*Math.max(0, Math.cos(q))]; A[i] = [-.85*Math.sin(q), -1.5]; }
  } else if (o.mode === 'jump') {
    lean = .12;
    if (o.vy > 0) { L = [[1.35, 2.1], [-.25, 1.3]]; A = [[2.7, -.2], [2.2, -.4]]; hipY = -11.4; }
    else { L = [[.55, .9], [-.15, .5]]; A = [[1.9, -.6], [-1.9, .6]]; hipY = -11.8; }
  } else if (o.mode === 'tuck') {
    lean = .2; L = [[1.9, 2.8], [1.7, 2.6]]; A = [[1.1, -1.2], [.9, -1.2]]; hipY = -10;
  } else if (o.mode === 'win') {
    L = [[.15, .2], [-.15, .2]]; A = [[2.6, .3], [-2.6, -.3]]; hipY = -11.6;
  } else { // idle
    const b = Math.sin(t*.0025);
    hipY = -11.5 + b*.25; L = [[.12, .05], [-.12, .05]]; A = [[.18 + b*.04, -.35], [-.18, -.35]];
  }
  const hip = [0, hipY];
  const neck = [hip[0] + Math.sin(lean)*8.4, hip[1] - Math.cos(lean)*8.4];
  const head = [neck[0] + Math.sin(lean)*5.2, neck[1] - Math.cos(lean)*5.2 + headOff];
  const legs = L.map(([a, k]) => { const kn = pt(hip, a, 6); return [kn, pt(kn, a - k, 6)]; });
  const arms = A.map(([a, k]) => { const el = pt(neck, a, 4.8); return [el, pt(el, a - k, 4.6)]; });
  return {hip, neck, head, legs, arms};
}
function drawHero(x, y, o){
  if (o.mode === 'sleep') return drawSleep(x, y, o.t);
  c.save(); c.translate(x, y);
  if (o.sq) c.scale(1 + o.sq*.18, 1 - o.sq*.18);
  if (o.flip) { c.translate(0, -13); c.rotate(o.flip); c.translate(0, 13); }
  stick(pose(o), HC);
  c.restore();
}
function drawSleep(x, y, t){
  c.save(); c.translate(x, y);
  const br = Math.sin(t*.002)*.4;
  const hip = [-2, -2.5], neck = [1.5, -10.5 + br], head = [5, -14 + br];
  const legs = [[[3.5, -8], [8, -1]], [[3, -7.5], [7, -1]]];
  const arms = [[[4.5, -6], [6.5, -9]], [[4, -6], [6, -8.5]]];
  stick({hip, neck, head, legs, arms}, HC);
  c.fillStyle = '#fff'; c.strokeStyle = OL; c.lineWidth = .6;
  for (let i = 0; i < 3; i++) { const k = ((t*.0006) + i/3) % 1; c.globalAlpha = Math.sin(k*Math.PI); c.font = `bold ${4 + k*4}px sans-serif`; c.strokeText('z', 8 + k*8, -20 - k*16); c.fillText('z', 8 + k*8, -20 - k*16); }
  c.globalAlpha = 1;
  c.restore();
}

function drawConfetti(winT){
  if (winT < 0 || winT > 6) return;
  const cols = ['#ff5a4e','#ffd23f','#3fbf72','#4aa3f5','#c56bff','#ff9f43'];
  for (let i = 0; i < 70; i++) {
    const sx = hash(i*1.3)*VW, sp = 30 + hash(i*2.7)*40, delay = hash(i*4.1)*1.2;
    const k = winT - delay; if (k < 0) continue;
    const y = -10 + k*sp, x = sx + Math.sin(k*3 + i)*8;
    if (y > VH + 10) continue;
    c.save(); c.translate(x, y); c.rotate(k*5 + i);
    c.globalAlpha = Math.min(1, (6 - winT));
    c.fillStyle = cols[i % 6]; c.fillRect(-1.5, -1, 3, 2);
    c.restore();
  }
  c.globalAlpha = 1;
}

let camS = null;
function frame(){
  requestAnimationFrame(frame);
  now = performance.now();
  if (st.d !== today() && !st.run) { st = fresh(); save(); ui(); }
  const ms = studyMs();
  let s = Math.min(STAGE, ms/1000);
  if (s >= STAGE && !st.winAt) { st.winAt = Date.now(); if (st.run) { st.acc = STAGE*1000; st.run = false; st.stopAt = Date.now(); } save(); ui(); }
  const winT = st.winAt ? (Date.now() - st.winAt)/1000 : -1;
  const hero = heroAt(s);
  const p = s/STAGE;
  let cam = hero.x - VW*.34;
  cam = Math.max(0, Math.min(cam, L.endCol*T - VW));
  c.setTransform(SC, 0, 0, SC, 0, 0);
  drawSky(p, now);
  drawMountains(cam, p);
  drawClouds(cam, now);
  drawHills(cam, p);
  for (const d of L.decos) drawDeco(d, cam, true);
  drawGoal(cam, s, winT);
  drawSigns(cam, s);
  drawGround(cam);
  drawStumps(cam);
  drawPlats(cam, now);
  drawBlocks(cam, s);
  drawCoins(cam, s);
  drawEnemies(cam, s);
  drawDust(cam, s, hero);
  // hero state
  let mode, hy = hero.y, sq = 0;
  const idleFor = st.stopAt ? (Date.now() - st.stopAt)/1000 : 0;
  if (winT >= 0) { mode = 'win'; const k = winT % .9; hy += winT < 3.6 ? Math.sin(k/.9*Math.PI)*14 : 0; }
  else if (!st.run) mode = (ms > 0 && idleFor > 6) || (ms === 0 && idleFor > 20) ? 'sleep' : 'idle';
  else if (hero.air) mode = 'jump';
  else mode = 'run';
  if (st.run && !hero.air) { for (const l of landings) { const a = s - l.t; if (a >= 0 && a < .12) { sq = 1 - a/.12; break; } if (a < 0) break; } }
  if (mode !== 'win' && hero.air && hero.g.k === 'b' && Math.abs(hero.u - .5) < .06) sq = -.4;
  let flip = 0;
  if (mode === 'jump' && hero.g.A >= 40) { const k = Math.max(0, Math.min(1, (hero.u - .12)/.7)); flip = k*k*(3 - 2*k)*Math.PI*2; if (k > 0 && k < 1) mode = 'tuck'; }
  drawHero(hero.x - cam, Y(hy), {mode, ph: hero.x/6.5, vy: hero.vy, t: now, sq, flip});
  for (const d of L.decos) drawDeco(d, cam, false);
  drawConfetti(winT);
  $('ban').classList.toggle('on', winT >= 0);
  if (winT >= 0) $('bans').textContent = `コイン ${coinsAt(STAGE)} / ${TOTAL_COINS} · つぎは 1-2（準備中）`;
}

let lastUi = 0;
setInterval(() => { if (st.run || Date.now() - lastUi > 1000) { ui(); lastUi = Date.now(); } }, 250);
resize(); ui(); if (st.run) lockWake();
requestAnimationFrame(frame);
})();
</script>
