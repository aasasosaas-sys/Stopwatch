<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>勉強クエスト</title>
<style>
:root{
  --bg:#fff;--fg:#000;--sub:#8e8e93;--card:#f2f2f7;--line:#d1d1d6;
  --acc:#ff9500;--go:#1f9d3a;--go-bg:#d9f2df;--stop:#e5362b;--stop-bg:#fde2df;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--fg:#fff;--card:#1c1c1e;--line:#2c2c2e;--acc:#ff9f0a;--go:#30d158;--go-bg:#0c2a14;--stop:#ff453a;--stop-bg:#3a100d}
}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,"SF Pro Display","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 24px}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-height:62vh;border-radius:18px;overflow:hidden;background:#8fd3ff;
  box-shadow:0 1px 0 rgba(0,0,0,.04)}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding:10px 14px;color:#fff;font-weight:800;font-size:clamp(12px,2.6vw,18px);letter-spacing:.04em;
  text-shadow:0 2px 0 rgba(30,20,60,.55);pointer-events:none;font-variant-numeric:tabular-nums}
.hud small{display:block;font-size:.72em;font-weight:700;opacity:.95}
.hud .r{text-align:right}
.coin{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#ffd23f;box-shadow:inset -2px -2px 0 #e0a412,0 2px 0 rgba(30,20,60,.55);vertical-align:-.05em;margin-right:.25em}
.banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  color:#fff;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s}
.banner.on{opacity:1}
.banner b{font-size:clamp(26px,7vw,56px);font-weight:900;letter-spacing:.06em;
  text-shadow:0 4px 0 #c2410c,0 8px 18px rgba(0,0,0,.25);transform:scale(.6);transition:transform .6s cubic-bezier(.2,1.6,.4,1)}
.banner.on b{transform:none}
.banner span{font-weight:800;font-size:clamp(13px,2.8vw,18px);text-shadow:0 2px 0 rgba(30,20,60,.55)}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(20,16,40,.62);color:#fff;
  padding:8px 14px;border-radius:999px;font-size:clamp(12px,2.6vw,15px);font-weight:600;white-space:nowrap;transition:opacity .4s;pointer-events:none}
.hint.off{opacity:0}

.panel{display:grid;grid-template-columns:1fr auto;gap:14px 18px;align-items:center;margin-top:16px}
.tt{font-size:clamp(40px,11vw,72px);font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.lbl{color:var(--sub);font-size:14px;margin-bottom:4px}
.cir{width:96px;height:96px;border-radius:50%;font-size:18px;font-weight:500;background:var(--go-bg);color:var(--go);transition:transform .15s,background .25s,color .25s}
.cir.stop{background:var(--stop-bg);color:var(--stop)}
.cir:active{transform:scale(.95)}
.cir:disabled{opacity:.4}
.prog{grid-column:1/-1}
.bar{position:relative;height:10px;border-radius:99px;background:var(--card);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#5ccf4f,#ffb020);border-radius:99px;width:0}
.ticks{display:flex;justify-content:space-between;color:var(--sub);font-size:11px;margin-top:4px;font-variant-numeric:tabular-nums}
.meta{display:flex;justify-content:space-between;font-size:15px;margin-top:10px}
.meta b{font-weight:600}
.map{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px}
.map h3{margin:0 0 10px;font-size:15px;font-weight:600}
.map h3 span{color:var(--sub);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.w{display:flex;flex-direction:column;gap:3px;align-items:center}
.w i{display:block;width:100%;aspect-ratio:1;border-radius:4px;background:var(--card);position:relative;overflow:hidden}
.w i.cur{outline:2px solid var(--acc);outline-offset:1px}
.w i u{position:absolute;left:0;bottom:0;right:0;background:#5ccf4f}
.w i.done{background:#5ccf4f}
.w em{font-style:normal;color:var(--sub);font-size:11px;margin-top:2px}
.dev{grid-column:1/-1;color:var(--sub);font-size:14px;border-top:1px solid var(--line);padding-top:12px}
.dev summary{cursor:pointer}
.dev .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.pill{background:var(--card);border-radius:999px;padding:8px 16px;font-size:14px}
.pill.on{background:var(--acc);color:#fff}
.dev p{margin:8px 0 0;font-size:13px;line-height:1.5}
.shopbtn{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600}
.shopbtn small{display:block;color:var(--sub);font-weight:400;font-size:13px;margin-top:2px;text-align:left}
.shopbtn b,.bal{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,8,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sh-in{background:var(--bg);width:100%;max-width:560px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sh-top{display:flex;align-items:center;gap:12px}
.sh-top>b{font-size:20px;flex:1}
.sh-note{margin:0;color:var(--sub);font-size:13px;line-height:1.5}
#pv{width:100%;aspect-ratio:2/1;border-radius:14px;display:block;background:#8fd3ff}
.tabs2{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:3px}
.tabs2 button{flex:1;background:none;border-radius:999px;padding:8px 0;font-size:15px}
.tabs2 button.on{background:var(--bg);color:var(--acc);font-weight:600}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.items button{background:var(--card);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:14px;border:2px solid transparent}
.items button.sel{border-color:var(--acc)}
.items i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25)}
.items em{font-style:normal;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.items em.own{color:var(--go)}
.act{background:var(--acc);color:#fff;border-radius:14px;padding:14px;font-size:17px;font-weight:600}
.act:disabled{background:var(--card);color:var(--sub)}
@media (max-width:520px){.cir{width:84px;height:84px;font-size:17px}.grid{gap:4px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div>WORLD 1-1<small>はじまりの草原</small></div>
      <div><span class="coin"></span>×<span id="hc">0</span></div>
      <div class="r">のこり<small id="hl" style="font-size:1em">10:00</small></div>
    </div>
    <div class="hint" id="hint">「開始」を押して勉強スタート。キャラが自動で進みます</div>
    <div class="banner" id="ban"><b>STAGE CLEAR!</b><span id="bans"></span></div>
  </div>

  <div class="panel">
    <div>
      <div class="lbl">今日の勉強時間</div>
      <div class="tt" id="tt">0:00</div>
    </div>
    <button class="cir" id="go">開始</button>
    <div class="prog">
      <div class="bar"><i id="pb"></i></div>
      <div class="ticks"><span>0分</span><span>2分</span><span>4分</span><span>6分</span><span>8分</span><span>10分</span></div>
      <div class="meta"><span>ステージ 1-1</span><b id="pt">0%</b></div>
    </div>
    <button class="shopbtn" id="shopb"><span>ショップ<small>コインで見た目を変えられます</small></span><b><span class="coin"></span><span id="wl">0</span></b></button>
    <div class="map">
      <h3>全72ステージ <span>· 1ステージ10分 · 12時間でオールクリア</span></h3>
      <div class="grid" id="grid"></div>
    </div>
    <details class="dev">
      <summary>確認用（早送り・リセット）</summary>
      <div class="row">
        <span>速度</span>
        <button class="pill" data-m="1">×1</button>
        <button class="pill" data-m="10">×10</button>
        <button class="pill" data-m="60">×60</button>
        <button class="pill" id="rs" style="margin-left:auto">リセット</button>
      </div>
      <p>早送り中は勉強時間も速く進みます。評価用の機能です。</p>
    </details>
  </div>
</div>

<div class="sheet" id="shop" hidden>
  <div class="sh-in" role="dialog" aria-label="ショップ">
    <div class="sh-top"><b>ショップ</b><span class="bal"><span class="coin"></span><span id="sbal">0</span></span><button class="pill" id="shx">閉じる</button></div>
    <p class="sh-note">変わるのは見た目だけで、速さやジャンプは変わりません。値段は仮です。</p>
    <canvas id="pv"></canvas>
    <div class="tabs2" id="stabs"></div>
    <div class="items" id="sitems"></div>
    <button class="act" id="sact">装備中</button>
  </div>
</div>
<script>
(() => {
'use strict';
const T = 16, VH = 192, STAGE = 600, HEAD = 27;
const cv = document.getElementById('cv'), mainCtx = cv.getContext('2d');
let c = mainCtx;
const $ = id => document.getElementById(id);

/* ---------- seeded random ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };

/* ---------- level generation ----------
   The whole stage is a pure function of study seconds s (0..600).
   The generator lays out terrain and, together with it, the exact path
   (runs + jumps) the hero takes, so the auto-play never fails. */
function build(seed){
  const R = rng(seed), ri = (a,b) => a + Math.floor(R()*(b-a+1)), pick = a => a[Math.floor(R()*a.length)];
  const G = [], segs = [], coins = [], blocks = [], enemies = [], stumps = [], plats = [], decos = [];
  const TARGET = 2700;
  let col = 0, h = 2, px = 2*T, hp = 2*T;

  const flat = (n, deco = true) => {
    for (let i = 0; i < n; i++, col++) {
      G[col] = h;
      if (deco && R() < .42) decos.push({x: col*T + ri(2,14), y: h*T, k: pick(['f','f','f','g','g','g','b','b','r','t','t','fe'])});
    }
  };
  const runTo = x => { if (x > px + .01) { segs.push({j:0, x0:px, x1:x, h0:hp, h1:hp}); px = x; } };
  const jump = (x0, x1, h1, A, k) => {
    x0 = Math.max(x0, px); runTo(x0);
    const s = {j:1, x0, x1, h0:hp, h1, A, k}; segs.push(s); px = x1; hp = h1; return s;
  };
  const arcY = (s,u) => s.h0 + (s.h1 - s.h0)*u + 4*s.A*u*(1-u);
  const arcCoins = (s, n) => { for (let i = 1; i <= n; i++) { const u = i/(n+1); coins.push({x: s.x0 + (s.x1-s.x0)*u, y: arcY(s,u) + 12}); } };

  const F = {
    pit(d){
      const w = ri(2, d > .45 ? 5 : 3);
      const x0 = col*T - 3, x1 = (col+w)*T + 6;
      for (let i = 0; i < w; i++) G[col+i] = 0;
      col += w;
      const s = jump(x0, x1, hp, 20 + w*6);
      if (R() < .65) arcCoins(s, w + 1);
      flat(ri(2,4));
    },
    enemy(){
      const c0 = col; flat(9);
      const xm = (c0+3)*T + 8;
      jump(xm - 34, xm, hp + 9, 16, 'e');
      jump(xm, xm + 46, h*T, 26);
      enemies.push({xm, y: h*T, range: (c0+8.5)*T - xm});
    },
    enemy2(){
      const c0 = col; flat(15);
      const a = (c0+3)*T + 8, b = (c0+9)*T + 8;
      jump(a - 34, a, hp + 9, 16, 'e'); jump(a, a + 46, h*T, 26);
      jump(b - 34, b, hp + 9, 16, 'e'); jump(b, b + 46, h*T, 26);
      enemies.push({xm: a, y: h*T, range: (c0+6.5)*T - a});
      enemies.push({xm: b, y: h*T, range: (c0+14.5)*T - b});
    },
    block(){
      const c0 = col; flat(7);
      const b = c0 + 3, bx = b*T + 8, by = h*T + 3*T;
      blocks.push({x: b*T, y: by, q: 1, hx: bx});
      if (R() < .6) { blocks.push({x:(b-1)*T, y:by, q:0}); blocks.push({x:(b+1)*T, y:by, q:0}); }
      if (R() < .5) for (let i = 0; i < 3; i++) coins.push({x:(b-1+i)*T + 8, y: by + T + 8, sky: 1});
      jump(bx - 30, bx + 30, hp, 3*T - HEAD, 'b');
    },
    stump(d){
      const k = ri(1, d > .35 ? 3 : 2);
      flat(2);
      stumps.push({col, k, h});
      G[col] = h; G[col+1] = h; col += 2;
      const s = jump((col-2)*T - 22, col*T + 22, hp, k*T*1.25 + 14);
      if (R() < .4) arcCoins(s, 3);
      flat(ri(2,3));
    },
    stairs(){
      const n = ri(2,3);
      flat(1);
      for (let i = 0; i < n && h < 6; i++) { h++; jump(col*T - 12, col*T + 10, h*T, 16); flat(2, false); }
      for (let i = 0; i < 3; i++) coins.push({x:(col+i)*T + 8, y: h*T + 12});
      flat(2, false);
      while (h > 2) { h--; jump(col*T - 2, col*T + 14, h*T, 8); flat(2, false); }
      flat(2);
    },
    height(){
      if (h < 4 && R() < .55) { flat(1); h++; jump(col*T - 12, col*T + 10, h*T, 16); flat(ri(3,5)); }
      else if (h > 2) { h--; jump(col*T - 2, col*T + 14, h*T, 8); flat(ri(3,5)); }
      else flat(4);
    },
    plats(){
      const c0 = col, w = 10;
      for (let i = 0; i < w; i++) G[col+i] = 0;
      const y1 = Math.min(h + ri(1,2), 6), y2 = Math.min(h + ri(1,3), 7);
      plats.push({x:(c0+2)*T, w:3*T, y:y1*T}); plats.push({x:(c0+6)*T, w:3*T, y:y2*T});
      jump(c0*T - 3, (c0+2)*T + 8, y1*T, 22);
      for (let i = 0; i < 2; i++) coins.push({x:(c0+3+i)*T + 2, y: y1*T + 12});
      runTo((c0+5)*T - 6);
      const s = jump((c0+5)*T - 6, (c0+6)*T + 8, y2*T, 20);
      arcCoins(s, 1);
      runTo((c0+9)*T - 6);
      jump((c0+9)*T - 6, (c0+w)*T + 8, h*T, 18);
      col += w; flat(3);
    },
    bigpit(){
      flat(1);
      const w = ri(6, 8), x0 = col*T - 3, x1 = (col+w)*T + 6, xa = x0 + (x1 - x0)*.42;
      for (let i = 0; i < w; i++) G[col+i] = 0;
      col += w;
      const s1 = jump(x0, xa, hp + 40, 14, 'air');
      arcCoins(s1, 2);
      const s2 = jump(xa, x1, h*T, 26, 'dj');
      arcCoins(s2, 3);
      flat(ri(3,4));
    },
    ledge(){
      if (h > 3) return flat(4);
      flat(3);
      const e = col*T;
      jump(e - 40, e - 18, hp + 34, 12, 'air');
      h += 3; jump(e - 18, e + 14, h*T, 18, 'dj');
      const c0 = col; flat(ri(5,7));
      for (let i = 0; i < 3; i++) coins.push({x:(c0+2+i)*T + 8, y: h*T + 12});
      h -= 3; jump(col*T - 2, col*T + 30, h*T, 12, 'drop');
      flat(3);
    },
    wallkick(){
      if (h > 3) { h--; jump(col*T - 2, col*T + 14, h*T, 8); flat(3); }
      flat(4);
      const e = col*T, h0 = hp;
      jump(e - 46, e - 6, h0 + 46, 8, 'air');
      jump(e - 6, e - 28, h0 + 66, 6, 'kick');
      h += 5; jump(e - 28, e + 14, h*T, 14, 'dj');
      const c0 = col; flat(ri(5,6));
      for (let i = 0; i < 3; i++) coins.push({x:(c0+1+i)*T + 8, y: h*T + 12});
      h -= 5; jump(col*T - 2, col*T + 44, h*T, 16, 'drop');
      flat(3);
    },
    coins(){
      const c0 = col; flat(6);
      for (let i = 0; i < 4; i++) coins.push({x:(c0+1+i)*T + 8, y: h*T + 12});
    },
    rest(){ flat(ri(3,6)); }
  };
  const W = [['pit',5],['enemy',4],['enemy2',1.5],['block',3.5],['stump',3],['stairs',1.2],['height',2],['plats',1.4],['coins',1.5],['rest',1.5],['bigpit',2.5],['ledge',1.6],['wallkick',1.6]];
  const total = W.reduce((a,b) => a + b[1], 0);

  flat(10);
  decos.push({x: 4*T, y: h*T, k: 'start'});
  let last = '';
  while (col < TARGET) {
    const d = col / TARGET;
    let r = R()*total, k = 'rest';
    for (const [n,w] of W) { if ((r -= w) < 0) { k = n; break; } }
    if (k === last && k !== 'pit') continue;
    if (['plats','enemy2','stairs','bigpit','ledge','wallkick'].includes(k) && d < .06) continue;
    last = k; F[k](d);
  }
  while (h > 2) { h--; jump(col*T - 2, col*T + 14, h*T, 8); flat(3, false); }
  flat(5, false);
  const goalX = (col + 1)*T + 8;
  flat(22, false);
  runTo(goalX);
  const houseX = (col - 14)*T;

  /* timing: jumps take a physically plausible time, runs share the rest */
  let runLen = 0, jt = 0;
  for (const s of segs) {
    if (s.j) { s.d = s.k === 'kick' ? .26 : s.k === 'air' ? .2 + .05*Math.sqrt(Math.abs(s.h1 - s.h0) + s.A) : .22 + .06*Math.sqrt(s.A) + .002*(s.x1 - s.x0); jt += s.d; }
    else runLen += s.x1 - s.x0;
  }
  const V = runLen / (STAGE - jt);
  let t = 0;
  for (const s of segs) { if (!s.j) s.d = (s.x1 - s.x0)/V; s.t0 = t; t += s.d; }

  return {G, segs, coins, blocks, enemies, stumps, plats, decos, goalX, houseX, V, endCol: col};
}

const L = build(20261121);
const segs = L.segs;

function segAtX(x){ let lo = 0, hi = segs.length - 1; while (lo < hi) { const m = (lo+hi+1) >> 1; if (segs[m].x0 <= x) lo = m; else hi = m - 1; } return segs[lo]; }
function segAtT(s){ let lo = 0, hi = segs.length - 1; while (lo < hi) { const m = (lo+hi+1) >> 1; if (segs[m].t0 <= s) lo = m; else hi = m - 1; } return segs[lo]; }
function timeAt(x){ const g = segAtX(x); return g.t0 + Math.max(0, Math.min(1, (x - g.x0)/(g.x1 - g.x0)))*g.d; }
function heroAt(s){
  s = Math.max(0, Math.min(STAGE, s));
  const g = segAtT(s), u = Math.min(1, (s - g.t0)/g.d), x = g.x0 + (g.x1 - g.x0)*u;
  if (!g.j) return {x, y: g.h0, air: false, g, u};
  return {x, y: g.h0 + (g.h1 - g.h0)*u + 4*g.A*u*(1-u), air: true, g, u, vy: (g.h1 - g.h0) + 4*g.A*(1-2*u)};
}
for (const o of L.coins) o.t = timeAt(o.x);
for (const o of L.blocks) if (o.q) o.t = timeAt(o.hx);
for (const o of L.enemies) o.t = timeAt(o.xm);
const airFx = segs.filter(s => s.k === 'dj' || s.k === 'kick').map(s => ({x: s.x0, y: s.h0, t: s.t0, k: s.k}));
const landings = segs.filter(s => s.j && !['e','air','kick'].includes(s.k)).map(s => ({x: s.x1, y: s.h1, t: s.t0 + s.d}));
L.coins.sort((a,b) => a.t - b.t);
const coinTimes = L.blocks.filter(b => b.q).map(b => b.t).concat(L.coins.map(o => o.t)).sort((a,b) => a - b);
const TOTAL_COINS = coinTimes.length;
const coinsAt = s => { let n = 0; for (const t of coinTimes) { if (t <= s) n++; else break; } return n; };
const minuteSigns = [];
for (let m = 1; m <= 9; m++) {
  let x = heroAt(m*60).x, cl = Math.floor(x/T);
  for (let k = 0; k < 12 && (!L.G[cl] || L.stumps.some(st => cl === st.col || cl === st.col + 1)); k++) cl++;
  x = cl*T + 8; minuteSigns.push({x, y: L.G[cl]*T, m});
}

/* ---------- study clock ---------- */
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); };
const fresh = () => ({d: today(), acc: 0, run: false, t0: 0, mult: 1, stopAt: Date.now(), winAt: 0});
const SHOP = {
  color: {name: '色', items: [
    ['orange','オレンジ',0,'#ff5a2e'], ['blue','ブルー',50,'#2f7dff'], ['green','グリーン',50,'#22b455'], ['yellow','イエロー',50,'#f2b705'],
    ['pink','ピンク',80,'#ff5fa2'], ['purple','パープル',80,'#9b51e0'], ['black','ブラック',120,'#2a2a33'], ['white','ホワイト',120,'#ffffff'],
    ['gold','ゴールド',400,'#e8b100'], ['rainbow','レインボー',800,'rainbow']]},
  head: {name: '頭', items: [
    ['none','なし',0], ['cap','キャップ',80], ['band','ハチマキ',80], ['glasses','メガネ',100], ['beanie','ニット帽',120],
    ['cat','ネコ耳',150], ['horns','ツノ',150], ['halo','天使の輪',300], ['crown','王冠',400]]},
  back: {name: '背中', items: [
    ['none','なし',0], ['scarf','マフラー',100], ['pack','リュック',100], ['cape','マント',250], ['wings','つばさ',500]]},
  trail: {name: '軌跡', items: [
    ['none','なし',0], ['spark','キラキラ',150], ['stars','星',200], ['ghost','残像',300], ['rainbow','虹',600]]}
};
const freshBank = () => ({earned: 0, spent: 0, owned: ['color:orange','head:none','back:none','trail:none'], eq: {color: 'orange', head: 'none', back: 'none', trail: 'none'}});
let bank;
try { bank = JSON.parse(localStorage.getItem('quest-bank')); } catch (e) {}
if (!bank || !bank.eq) bank = freshBank();
const saveBank = () => { try { localStorage.setItem('quest-bank', JSON.stringify(bank)); } catch (e) {} };
const item = (cat, id) => SHOP[cat].items.find(i => i[0] === id) || SHOP[cat].items[0];
const lookOf = eq => ({color: item('color', eq.color)[3], head: eq.head, back: eq.back, trail: eq.trail});
const LOOK = () => lookOf(bank.eq);
let st;
try { st = JSON.parse(localStorage.getItem('quest-day')); } catch (e) {}
// coins from a finished day move into the wallet
const deposit = old => { if (old && old.acc) { bank.earned += coinsAt(Math.min(STAGE, old.acc/1000)); saveBank(); } };
if (!st || st.d !== today()) { deposit(st); st = fresh(); }
st.mult = st.mult || 1;
const save = () => { try { localStorage.setItem('quest-day', JSON.stringify(st)); } catch (e) {} };
const wallet = () => bank.earned + coinsAt(Math.min(STAGE, studyMs()/1000)) - bank.spent;
const studyMs = () => st.acc + (st.run ? (Date.now() - st.t0)*st.mult : 0);
const commit = () => { if (st.run) { const n = Date.now(); st.acc += (n - st.t0)*st.mult; st.t0 = n; } };

let wake = null;
const lockWake = async () => { try { if (st.run && navigator.wakeLock && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen'); } catch (e) {} };
document.addEventListener('visibilitychange', lockWake);

function toggle(){
  if (st.run) { commit(); st.run = false; st.stopAt = Date.now(); if (wake) { wake.release().catch(()=>{}); wake = null; } }
  else { if (studyMs() >= STAGE*1000) return; st.run = true; st.t0 = Date.now(); lockWake(); }
  save(); ui();
}
$('go').onclick = toggle;
document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { commit(); st.mult = +b.dataset.m; save(); ui(); });
$('rs').onclick = () => { if (confirm('今日の記録とステージ1-1をリセットしますか？（集めたコインは残ります）')) { commit(); deposit(st); st = fresh(); save(); ui(); } };
window.__setEq = eq => { Object.assign(bank.eq, eq); };
window.__quest = { L: () => L, set(sec){ st.acc = sec*1000; st.t0 = Date.now(); st.winAt = 0; save(); ui(); } };

/* ---------- map grid ---------- */
const grid = $('grid');
grid.innerHTML = Array.from({length: 12}, (_, w) => `<div class="w">${Array.from({length: 6}, (_, i) => `<i data-s="${w*6+i}"><u></u></i>`).join('')}<em>${w+1}</em></div>`).join('');
const cells = [...grid.querySelectorAll('i')];

const fmt = ms => { const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s/60)%60, x = s%60; return h + ':' + String(m).padStart(2,'0') + ':' + String(x).padStart(2,'0'); };
const fmtShort = s => { s = Math.ceil(s); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };

function ui(){
  const ms = studyMs(), s = Math.min(STAGE, ms/1000), p = s/STAGE;
  $('tt').textContent = ms < 3600000 ? fmt(ms).slice(2) : fmt(ms);
  $('go').textContent = st.run ? '停止' : (s >= STAGE ? 'クリア' : '開始');
  $('go').className = 'cir' + (st.run ? ' stop' : '');
  $('go').disabled = !st.run && s >= STAGE;
  $('pb').style.width = (p*100) + '%';
  $('pt').textContent = Math.floor(p*100) + '%';
  $('hl').textContent = fmtShort(STAGE - s);
  $('hc').textContent = coinsAt(s);
  $('wl').textContent = wallet();
  $('hint').classList.toggle('off', st.run || ms > 0);
  document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', +b.dataset.m === st.mult));
  cells.forEach((el, i) => {
    const f = i === 0 ? p : 0;
    el.classList.toggle('done', f >= 1);
    el.classList.toggle('cur', i === 0 && f < 1);
    el.firstChild.style.height = (f < 1 ? f*100 : 0) + '%';
  });
}

/* ---------- drawing ---------- */
let SC = 1, VW = 320, dpr = 1;
function resize(){
  const r = cv.getBoundingClientRect(); dpr = Math.min(3, devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(r.width*dpr)); cv.height = Math.max(1, Math.round(r.height*dpr));
  SC = cv.height / VH; VW = cv.width / SC;
}
addEventListener('resize', resize);

const OL = '#2b2340';
const lerp = (a,b,t) => a + (b-a)*t;
const mix = (a,b,t) => { const pa = a.match(/\w\w/g).map(x => parseInt(x,16)), pb = b.match(/\w\w/g).map(x => parseInt(x,16)); return 'rgb(' + pa.map((v,i) => Math.round(lerp(v,pb[i],t))).join(',') + ')'; };
const rr = (x,y,w,h,r) => { c.beginPath(); c.roundRect ? c.roundRect(x,y,w,h,r) : c.rect(x,y,w,h); };
const Y = wy => VH - wy;

function drawSky(p, now){
  const top = p < .6 ? mix('#5cb8ff','#4aa3f5',p/.6) : mix('#4aa3f5','#ff9b6a',(p-.6)/.4);
  const bot = p < .6 ? mix('#cdeeff','#bfe7ff',p/.6) : mix('#bfe7ff','#ffe0a3',(p-.6)/.4);
  const g = c.createLinearGradient(0,0,0,VH); g.addColorStop(0,top); g.addColorStop(1,bot);
  c.fillStyle = g; c.fillRect(0,0,VW,VH);
  // sun
  const sx = VW*.8, sy = lerp(30, 70, p);
  c.fillStyle = p < .7 ? 'rgba(255,250,210,.35)' : 'rgba(255,220,150,.4)';
  c.beginPath(); c.arc(sx, sy, 22, 0, 7); c.fill();
  c.fillStyle = p < .7 ? '#fff6c8' : '#ffd38a';
  c.beginPath(); c.arc(sx, sy, 13, 0, 7); c.fill();
}
function drawMountains(cam, p){
  const off = cam*.12;
  c.fillStyle = p < .6 ? '#a9d8f2' : mix('#a9d8f2','#f0b9a0',(p-.6)/.4);
  c.beginPath(); c.moveTo(0, VH);
  for (let x = 0; x <= VW + 4; x += 4) {
    const w = x + off;
    c.lineTo(x, 112 - (Math.sin(w*.011)*20 + Math.sin(w*.027+1.3)*11 + Math.sin(w*.061+2)*4));
  }
  c.lineTo(VW, VH); c.fill();
  c.fillStyle = 'rgba(255,255,255,.55)';
  for (let x = 0; x <= VW; x += 4) {
    const w = x + off, y = 112 - (Math.sin(w*.011)*20 + Math.sin(w*.027+1.3)*11 + Math.sin(w*.061+2)*4);
    if (y < 86) c.fillRect(x, y, 4.3, (86 - y)*.5);
  }
}
function drawClouds(cam, now){
  const par = .25, sp = 130;
  const drift = now*.004;
  const base = cam*par + drift;
  const i0 = Math.floor(base/sp) - 1, i1 = Math.ceil((base + VW)/sp) + 1;
  c.fillStyle = '#fff';
  for (let i = i0; i <= i1; i++) {
    const x = i*sp + hash(i)*70 - base, y = 22 + hash(i+.3)*48, s = .7 + hash(i+.7)*.7;
    c.globalAlpha = .92;
    c.beginPath();
    c.ellipse(x, y, 18*s, 8*s, 0, 0, 7);
    c.ellipse(x - 10*s, y + 2*s, 10*s, 6*s, 0, 0, 7);
    c.ellipse(x + 11*s, y + 1*s, 12*s, 7*s, 0, 0, 7);
    c.ellipse(x + 2*s, y - 6*s, 11*s, 8*s, 0, 0, 7);
    c.fill();
  }
  c.globalAlpha = 1;
}
function drawHills(cam, p){
  const par = .45, sp = 110, base = cam*par;
  const i0 = Math.floor(base/sp) - 1, i1 = Math.ceil((base + VW)/sp) + 1;
  for (let i = i0; i <= i1; i++) {
    const x = i*sp + hash(i*3.1)*50 - base, r = 34 + hash(i*1.7)*34, y = 160;
    c.fillStyle = p < .6 ? '#8fdc7a' : mix('#8fdc7a','#b9c86a',(p-.6)/.4);
    c.beginPath(); c.ellipse(x, y, r*1.3, r, 0, Math.PI, 0); c.fill();
    c.fillStyle = 'rgba(255,255,255,.18)';
    c.beginPath(); c.ellipse(x - r*.35, y - r*.55, r*.35, r*.18, -.4, 0, 7); c.fill();
    // little trees on hills
    if (hash(i*5.3) > .4) {
      const tx = x + (hash(i*9.1) - .5)*r, ty = y - Math.sqrt(Math.max(0, 1 - ((tx - x)/(r*1.3))**2))*r;
      c.fillStyle = '#5bb85a'; c.beginPath(); c.arc(tx, ty - 6, 6, 0, 7); c.fill();
    }
  }
  c.fillStyle = p < .6 ? '#7dcf6a' : mix('#7dcf6a','#a7b85e',(p-.6)/.4);
  c.fillRect(0, 158, VW, VH);
}

function drawGround(cam){
  const G = L.G, i0 = Math.max(0, Math.floor(cam/T) - 1), i1 = Math.ceil((cam + VW)/T) + 1;
  for (let i = i0; i <= i1; i++) {
    const g = G[i] || 0; if (!g) continue;
    const x = i*T - cam, top = Y(g*T);
    c.fillStyle = '#c98a4b'; c.fillRect(x - .05, top + 4, T + .1, g*T);
    c.fillStyle = '#a86b37';
    for (let k = 0; k < g*2; k++) {
      const hx = hash(i*7 + k*13), hy = hash(i*3 + k*29);
      if (hx > .55) { rr(x + 2 + hx*10, top + 9 + k*8 + hy*3, 3, 2, 1); c.fill(); }
    }
    const L1 = (G[i-1] || 0) < g, R1 = (G[i+1] || 0) < g;
    c.fillStyle = '#3f9e3c'; c.fillRect(x - .05, top + 3, T + .1, 3);
    c.fillStyle = '#5ccf4f'; c.fillRect(x - .05, top, T + .1, 4.5);
    // grass scallops
    c.fillStyle = '#5ccf4f';
    for (let k = 0; k < 4; k++) { c.beginPath(); c.arc(x + 2 + k*4, top + 4.5, 2, 0, Math.PI); c.fill(); }
    c.fillStyle = '#8ee676'; c.fillRect(x - .05, top, T + .1, 1.2);
    if (L1) { c.fillStyle = '#8a5629'; c.fillRect(x, top + 6, 1.5, g*T); c.fillStyle = '#5ccf4f'; c.beginPath(); c.arc(x + 2, top + 2.5, 2.5, 0, 7); c.fill(); }
    if (R1) { c.fillStyle = '#8a5629'; c.fillRect(x + T - 1.5, top + 6, 1.5, g*T); c.fillStyle = '#5ccf4f'; c.beginPath(); c.arc(x + T - 2, top + 2.5, 2.5, 0, 7); c.fill(); }
  }
}
function drawStumps(cam){
  for (const s of L.stumps) {
    const x = s.col*T - cam; if (x > VW + 40 || x < -40) continue;
    const top = Y((s.h + s.k)*T), bot = Y(s.h*T);
    c.fillStyle = '#9a6034'; rr(x + 1, top + 3, 2*T - 2, bot - top - 3 + 2, 2); c.fill();
    c.fillStyle = '#7d4a26';
    for (let k = 0; k < 3; k++) c.fillRect(x + 6 + k*8, top + 8, 1.5, bot - top - 10);
    c.strokeStyle = OL; c.lineWidth = .9; rr(x + 1, top + 3, 2*T - 2, bot - top - 1, 2); c.stroke();
    c.fillStyle = '#e8b57a'; c.beginPath(); c.ellipse(x + T, top + 3.5, T - 1, 3.5, 0, 0, 7); c.fill(); c.stroke();
    c.strokeStyle = '#b98550'; c.lineWidth = .7;
    c.beginPath(); c.ellipse(x + T, top + 3.5, T*.55, 2, 0, 0, 7); c.stroke();
    c.beginPath(); c.ellipse(x + T, top + 3.5, T*.22, .9, 0, 0, 7); c.stroke();
    // root
    c.fillStyle = '#9a6034'; c.beginPath(); c.ellipse(x + 1, bot, 3, 2, 0, Math.PI, 0); c.ellipse(x + 2*T - 1, bot, 3, 2, 0, Math.PI, 0); c.fill();
  }
}
function drawPlats(cam, now){
  for (const p of L.plats) {
    const x = p.x - cam; if (x > VW + 40 || x + p.w < -40) continue;
    const y = Y(p.y);
    c.fillStyle = '#c98a4b';
    c.beginPath(); c.moveTo(x, y + 3); c.lineTo(x + p.w, y + 3); c.lineTo(x + p.w - 8, y + 14); c.quadraticCurveTo(x + p.w/2, y + 24, x + 8, y + 14); c.closePath(); c.fill();
    c.strokeStyle = OL; c.lineWidth = .9; c.stroke();
    c.fillStyle = '#5ccf4f'; rr(x - 1, y - 1, p.w + 2, 6, 3); c.fill(); c.stroke();
    c.fillStyle = '#8ee676'; c.fillRect(x + 2, y, p.w - 4, 1.2);
  }
}
function star(x, y, r, fill){
  c.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI/2 + i*Math.PI/5, rad = i % 2 ? r*.45 : r; c.lineTo(x + Math.cos(a)*rad, y + Math.sin(a)*rad); }
  c.closePath(); c.fillStyle = fill; c.fill();
}
function drawBlocks(cam, s){
  for (const b of L.blocks) {
    const x = b.x - cam; if (x > VW + 20 || x < -20) continue;
    let y = Y(b.y + T);
    if (b.q) {
      const age = s - b.t;
      if (age >= 0 && age < .25) y -= Math.sin(age/.25*Math.PI)*5;
      const used = age >= 0;
      c.fillStyle = used ? '#b5855a' : '#ffc93c'; rr(x + .5, y + .5, T - 1, T - 1, 3); c.fill();
      c.strokeStyle = OL; c.lineWidth = .9; c.stroke();
      if (!used) {
        c.fillStyle = '#ffe58a'; c.fillRect(x + 2.5, y + 2.5, T - 5, 1.5);
        star(x + 8, y + 8.5, 5, '#fff7d6');
        c.strokeStyle = '#d98a1a'; c.lineWidth = .6; c.stroke();
      } else {
        c.fillStyle = '#8f6440'; [[3,3],[11,3],[3,11],[11,11]].forEach(([a,b2]) => { c.beginPath(); c.arc(x + a + .5, y + b2 + .5, 1, 0, 7); c.fill(); });
      }
      // popped coin
      if (age >= 0 && age < .7) {
        const k = age/.7, cy = y - 6 - Math.sin(k*Math.PI)*22;
        c.globalAlpha = 1 - Math.max(0, k - .6)/.4;
        coin(x + 8, cy, 1, now);
        c.globalAlpha = 1;
      }
    } else {
      c.fillStyle = '#e07a3f'; rr(x + .5, y + .5, T - 1, T - 1, 2); c.fill();
      c.strokeStyle = OL; c.lineWidth = .9; c.stroke();
      c.strokeStyle = '#b35424'; c.lineWidth = .7;
      c.beginPath(); c.moveTo(x + 1, y + 8); c.lineTo(x + T - 1, y + 8); c.moveTo(x + 8, y + 1); c.lineTo(x + 8, y + 8); c.moveTo(x + 4, y + 8); c.lineTo(x + 4, y + T - 1); c.moveTo(x + 12, y + 8); c.lineTo(x + 12, y + T - 1); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(x + 2, y + 2, T - 4, 1.2);
    }
  }
}
let now = 0;
function coin(x, y, sc, t){
  const w = Math.abs(Math.cos(t*.004 + x*.05))*5*sc + .8;
  c.fillStyle = '#ffd23f'; c.beginPath(); c.ellipse(x, y, w, 5.5*sc, 0, 0, 7); c.fill();
  c.strokeStyle = '#c98a12'; c.lineWidth = .8; c.stroke();
  if (w > 2.5) { c.fillStyle = '#fff3b0'; c.fillRect(x - w*.35, y - 3*sc, Math.max(.8, w*.25), 6*sc); }
}
function drawCoins(cam, s){
  for (const o of L.coins) {
    const x = o.x - cam; if (x > VW + 10 || x < -30) continue;
    const age = s - o.t, y = Y(o.y);
    if (age < 0) coin(x, y, 1, now);
    else if (age < .35) {
      const k = age/.35;
      c.globalAlpha = 1 - k;
      for (let i = 0; i < 4; i++) { const a = i*Math.PI/2 + .6; star(x + Math.cos(a)*k*10, y + Math.sin(a)*k*10 - k*4, 2.2, '#fff6a8'); }
      c.globalAlpha = 1;
    }
  }
}
function drawEnemy(x, y, mode, ph, age){
  c.save(); c.translate(x, y);
  let sx = 1, sy = 1;
  if (mode === 'walk') { sy = 1 + Math.sin(ph)*.08; sx = 1 - Math.sin(ph)*.06; }
  else if (mode === 'idle') { sy = 1 + Math.sin(ph*.5)*.04; }
  else if (mode === 'flat') { sy = .32; sx = 1.35; }
  c.scale(sx, sy);
  // body
  c.fillStyle = '#9a78e0';
  c.beginPath(); c.moveTo(-8, 0); c.bezierCurveTo(-9, -12, 9, -12, 8, 0); c.closePath(); c.fill();
  c.strokeStyle = OL; c.lineWidth = .9; c.stroke();
  c.fillStyle = '#c9b6f5'; c.beginPath(); c.ellipse(-1, -2.2, 4.5, 2, 0, 0, 7); c.fill();
  // feet
  c.fillStyle = '#6f4fc0';
  const f = mode === 'walk' ? Math.sin(ph)*1.5 : 0;
  c.beginPath(); c.ellipse(-4 + f, 0, 2.6, 1.4, 0, 0, 7); c.ellipse(4 - f, 0, 2.6, 1.4, 0, 0, 7); c.fill();
  // sleepy eyes
  c.strokeStyle = OL; c.lineWidth = .9; c.lineCap = 'round';
  if (mode === 'flat') { c.beginPath(); c.moveTo(-5,-6); c.lineTo(-2,-4); c.moveTo(-5,-4); c.lineTo(-2,-6); c.moveTo(1,-6); c.lineTo(4,-4); c.moveTo(1,-4); c.lineTo(4,-6); c.stroke(); }
  else { c.beginPath(); c.arc(-3.5, -5.5, 1.6, .2, Math.PI - .2); c.moveTo(4.1, -5.5); c.arc(2.5, -5.5, 1.6, .2, Math.PI - .2); c.stroke(); }
  // nightcap
  c.fillStyle = '#4b7bd8';
  c.beginPath(); c.moveTo(-6, -7.5); c.quadraticCurveTo(0, -12.5, 6, -7.5); c.quadraticCurveTo(4, -14, 10 + Math.sin(ph*.5)*1.2, -12); c.quadraticCurveTo(2, -17, -6, -7.5); c.fill(); c.stroke();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(10.5 + Math.sin(ph*.5)*1.2, -12, 1.8, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#e8eeff'; rr(-6.5, -8.6, 13, 2.4, 1.2); c.fill(); c.stroke();
  c.restore();
}
function drawEnemies(cam, s){
  for (const e of L.enemies) {
    const age = s - e.t;
    let ex, mode;
    if (age < 0) { const dx = e.range ? Math.min(e.range, 14*(-age)) : 0; ex = e.xm + dx; mode = dx < e.range ? 'walk' : 'idle'; }
    else { ex = e.xm; mode = 'flat'; }
    const x = ex - cam; if (x > VW + 20 || x < -30) continue;
    const y = Y(e.y);
    if (mode === 'flat') {
      if (age > .9) continue;
      c.globalAlpha = age < .5 ? 1 : 1 - (age - .5)/.4;
      drawEnemy(x, y, 'flat', 0, age);
      // stars & z
      for (let i = 0; i < 5; i++) { const a = -Math.PI*(.15 + i*.175), r = 4 + age*28; star(x + Math.cos(a)*r, y - 4 + Math.sin(a)*r, 2.4*(1 - age), '#fff27a'); }
      c.fillStyle = '#fff'; c.font = 'bold 7px sans-serif'; c.fillText('z', x + 6 + age*8, y - 10 - age*18); c.fillText('Z', x + 10 + age*12, y - 16 - age*22);
      c.globalAlpha = 1;
    } else drawEnemy(x, y, mode, now*.012 + e.xm, 0);
  }
}
function drawDeco(d, cam, back){
  const x = d.x - cam; if (x > VW + 30 || x < -30) return;
  const y = Y(d.y);
  switch (d.k) {

  c.save(); c.translate(x, y);
  const br = Math.sin(t*.002)*.4;
  const hip = [-2, -2.5], neck = [1.5, -10.5 + br], head = [5, -14 + br];
  const legs = [[[3.5, -8], [8, -1]], [[3, -7.5], [7, -1]]];
  const arms = [[[4.5, -6], [6.5, -9]], [[4, -6], [6, -8.5]]];
  stick({hip, neck, head, legs, arms}, look, {t, mode: 'sleep'});
  c.fillStyle = '#fff'; c.strokeStyle = OL; c.lineWidth = .6;
  for (let i = 0; i < 3; i++) { const k = ((t*.0006) + i/3) % 1; c.globalAlpha = Math.sin(k*Math.PI); c.font = `bold ${4 + k*4}px sans-serif`; c.strokeText('z', 8 + k*8, -20 - k*16); c.fillText('z', 8 + k*8, -20 - k*16); }
  c.globalAlpha = 1;
  c.restore();
}
/* trail: sample(k) returns {x, y, o} in screen units for k steps back in time */
function drawTrail(kind, sample, look){
  if (kind === 'stars') {
    for (let k = 10; k >= 1; k--) { const p = sample(k, .045); const a = 1 - k/11; c.globalAlpha = a*.9; star(p.x - 2 + Math.sin(k*2.1)*2, p.y - 12 + Math.cos(k*1.7)*3, 1 + a*2.2, k % 2 ? '#fff6a8' : '#ffd23f'); }
  } else if (kind === 'ghost') {
    for (let k = 3; k >= 1; k--) { const p = sample(k, .06); c.globalAlpha = .16*(4 - k); drawHero(p.x, p.y, p.o, look); }
  } else if (kind === 'rainbow') {
    const cols = ['#ff4d4d','#ff9f1a','#ffe14d','#4dd26b','#4da6ff','#9d6bff'], pts = [];
    for (let k = 0; k <= 16; k++) pts.push(sample(k, .022));
    for (let i = 0; i < cols.length; i++) {
      c.strokeStyle = cols[i]; c.lineWidth = 1.25; c.lineCap = 'butt';
      for (let k = 0; k < 16; k++) { c.globalAlpha = .85*(1 - k/16); c.beginPath(); c.moveTo(pts[k].x - 2, pts[k].y - 15 + i*1.2); c.lineTo(pts[k+1].x - 2, pts[k+1].y - 15 + i*1.2); c.stroke(); }
    }
  } else if (kind === 'spark') {
    for (let k = 1; k <= 12; k++) { const p = sample(k, .03); const a = 1 - k/13; c.globalAlpha = a; c.fillStyle = k % 3 ? '#7fe7ff' : '#ffffff'; c.beginPath(); c.arc(p.x - 3 + Math.sin(k*7.3 + p.x)*3, p.y - 6 - Math.cos(k*3.1)*4 - k*.5, .6 + a*1.2, 0, 7); c.fill(); }
  }
  c.globalAlpha = 1;
}

function drawConfetti(winT){
  if (winT < 0 || winT > 6) return;
  const cols = ['#ff5a4e','#ffd23f','#3fbf72','#4aa3f5','#c56bff','#ff9f43'];
  for (let i = 0; i < 70; i++) {
    const sx = hash(i*1.3)*VW, sp = 30 + hash(i*2.7)*40, delay = hash(i*4.1)*1.2;
    const k = winT - delay; if (k < 0) continue;
    const y = -10 + k*sp, x = sx + Math.sin(k*3 + i)*8;
    if (y > VH + 10) continue;
    c.save(); c.translate(x, y); c.rotate(k*5 + i);
    c.globalAlpha = Math.min(1, (6 - winT));
    c.fillStyle = cols[i % 6]; c.fillRect(-1.5, -1, 3, 2);
    c.restore();
  }
  c.globalAlpha = 1;
}

function airPose(s){
  const h = heroAt(s), o = {x: h.x, y: h.y, mode: h.air ? 'jump' : 'run', ph: h.x/6.5, vy: h.vy, t: now, flip: 0, face: 1};
  if (h.air) {
    const gk = h.g.k;
    if (gk === 'dj' || (h.g.A >= 40 && gk !== 'air')) { const k = Math.max(0, Math.min(1, (h.u - .08)/.75)); o.flip = k*k*(3 - 2*k)*Math.PI*2; if (k > 0 && k < 1) o.mode = 'tuck'; }
    else if (gk === 'air' && h.g.A < 10 && h.u > .75) o.mode = 'wall';
    else if (gk === 'kick') { o.face = -1; if (h.u < .3) o.mode = 'wall'; }
  }
  return o;
}
let camS = null;
function frame(){
  requestAnimationFrame(frame);
  now = performance.now();
  if (st.d !== today() && !st.run) { deposit(st); st = fresh(); save(); ui(); }
  const ms = studyMs();
  let s = Math.min(STAGE, ms/1000);
  if (s >= STAGE && !st.winAt) { st.winAt = Date.now(); if (st.run) { st.acc = STAGE*1000; st.run = false; st.stopAt = Date.now(); } save(); ui(); }
  const winT = st.winAt ? (Date.now() - st.winAt)/1000 : -1;
  const hero = heroAt(s);
  const p = s/STAGE;
  let cam = hero.x - VW*.34;
  cam = Math.max(0, Math.min(cam, L.endCol*T - VW));
  c.setTransform(SC, 0, 0, SC, 0, 0);
  drawSky(p, now);
  drawMountains(cam, p);
  drawClouds(cam, now);
  drawHills(cam, p);
  for (const d of L.decos) drawDeco(d, cam, true);
  drawGoal(cam, s, winT);
  drawSigns(cam, s);
  drawGround(cam);
  drawStumps(cam);
  drawPlats(cam, now);
  drawBlocks(cam, s);
  drawCoins(cam, s);
  drawEnemies(cam, s);
  drawDust(cam, s, hero);
  // hero state
  let mode, hy = hero.y, sq = 0;
  const idleFor = st.stopAt ? (Date.now() - st.stopAt)/1000 : 0;
  if (winT >= 0) { mode = 'win'; const k = winT % .9; hy += winT < 3.6 ? Math.sin(k/.9*Math.PI)*14 : 0; }
  else if (!st.run) mode = (ms > 0 && idleFor > 6) || (ms === 0 && idleFor > 20) ? 'sleep' : 'idle';
  else if (hero.air) mode = 'jump';
  else mode = 'run';
  if (st.run && !hero.air) { for (const l of landings) { const a = s - l.t; if (a >= 0 && a < .12) { sq = 1 - a/.12; break; } if (a < 0) break; } }
  if (mode !== 'win' && hero.air && hero.g.k === 'b' && Math.abs(hero.u - .5) < .06) sq = -.4;
  let flip = 0;
  let face = 1;
  if (mode === 'jump') {
    const gk = hero.g.k;
    if (gk === 'dj' || (hero.g.A >= 40 && gk !== 'air')) { const k = Math.max(0, Math.min(1, (hero.u - .08)/.75)); flip = k*k*(3 - 2*k)*Math.PI*2; if (k > 0 && k < 1) mode = 'tuck'; }
    else if (gk === 'air' && hero.g.A < 10 && hero.u > .75) mode = 'wall';
    else if (gk === 'kick') { face = -1; if (hero.u < .3) mode = 'wall'; }
  }
  const look = LOOK();
  if (look.trail !== 'none' && st.run && winT < 0) drawTrail(look.trail, (k, dt) => { const ss = Math.max(0, s - k*dt), o = airPose(ss); return {x: o.x - cam, y: Y(o.y), o}; }, look);
  drawHero(hero.x - cam, Y(hy), {mode, ph: hero.x/6.5, vy: hero.vy, t: now, sq, flip, face}, look);
  for (const d of L.decos) drawDeco(d, cam, false);
  drawConfetti(winT);
  if (!$('shop').hidden) drawPreview();
  $('ban').classList.toggle('on', winT >= 0);
  if (winT >= 0) $('bans').textContent = `コイン ${coinsAt(STAGE)} / ${TOTAL_COINS} · つぎは 1-2（準備中）`;
}

/* ---------- shop ---------- */
const pv = $('pv'), pctx = pv.getContext('2d');
let shopCat = 'color', trial = null;
const owned = (cat, id) => bank.owned.includes(cat + ':' + id);
function shopRender(){
  $('sbal').textContent = wallet();
  $('stabs').innerHTML = Object.keys(SHOP).map(k => `<button data-cat="${k}" class="${k === shopCat ? 'on' : ''}">${SHOP[k].name}</button>`).join('');
  $('sitems').innerHTML = SHOP[shopCat].items.map(([id, name, price, col]) => {
    const tag = bank.eq[shopCat] === id ? '<em class="own">装備中</em>' : owned(shopCat, id) ? '<em class="own">持っている</em>' : `<em>${price} コイン</em>`;
    const sw = shopCat === 'color' ? `<i style="background:${col === 'rainbow' ? 'conic-gradient(#ff4d4d,#ffe14d,#4dd26b,#4da6ff,#9d6bff,#ff4d4d)' : col}"></i>` : '';
    return `<button data-id="${id}" class="${trial[shopCat] === id ? 'sel' : ''}">${sw}<span>${name}</span>${tag}</button>`;
  }).join('');
  const id = trial[shopCat], it = item(shopCat, id), a = $('sact');
  if (bank.eq[shopCat] === id) { a.textContent = '装備中'; a.disabled = true; }
  else if (owned(shopCat, id)) { a.textContent = '装備する'; a.disabled = false; }
  else if (wallet() >= it[2]) { a.textContent = `${it[2]} コインで買って装備する`; a.disabled = false; }
  else { a.textContent = `コインが足りません（あと ${it[2] - wallet()}）`; a.disabled = true; }
}
$('shopb').onclick = () => { trial = {...bank.eq}; $('shop').hidden = false; shopRender(); };
$('shx').onclick = () => { $('shop').hidden = true; ui(); };
$('shop').onclick = e => { if (e.target.id === 'shop') $('shx').onclick(); };
$('stabs').onclick = e => { const b = e.target.closest('[data-cat]'); if (b) { shopCat = b.dataset.cat; shopRender(); } };
$('sitems').onclick = e => { const b = e.target.closest('[data-id]'); if (b) { trial[shopCat] = b.dataset.id; shopRender(); } };
$('sact').onclick = () => {
  const id = trial[shopCat], it = item(shopCat, id);
  if (!owned(shopCat, id)) { if (wallet() < it[2]) return; bank.spent += it[2]; bank.owned.push(shopCat + ':' + id); }
  bank.eq[shopCat] = id; saveBank(); shopRender(); ui();
};
function drawPreview(){
  const r = pv.getBoundingClientRect(); if (!r.width) return;
  const W = Math.round(r.width*dpr), H = Math.round(r.height*dpr);
  if (pv.width !== W || pv.height !== H) { pv.width = W; pv.height = H; }
  const sc = H/72, vw = W/sc, gy = 58, x0 = vw*.5, V = 75;
  c = pctx; c.setTransform(sc, 0, 0, sc, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, 72); g.addColorStop(0, '#5cb8ff'); g.addColorStop(1, '#cdeeff');
  c.fillStyle = g; c.fillRect(0, 0, vw, 72);
  const sec = now/1000, off = (sec*V) % 16;
  c.fillStyle = '#c98a4b'; c.fillRect(0, gy, vw, 20);
  c.fillStyle = '#5ccf4f'; c.fillRect(0, gy, vw, 4);
  c.fillStyle = '#a86b37'; for (let x = -off; x < vw; x += 16) { rr(x + 4, gy + 9, 3, 2, 1); c.fill(); }
  const at = tt => {
    const k = ((tt % 2.6) + 2.6) % 2.6;
    if (k < 1.6) return {y: 0, mode: 'run', ph: tt*V/6.5, flip: 0, vy: 0};
    const u = (k - 1.6)/1, y = 4*26*u*(1 - u), q = Math.max(0, Math.min(1, (u - .08)/.75));
    return {y, mode: q > 0 && q < 1 ? 'tuck' : 'jump', ph: 0, flip: q*q*(3 - 2*q)*Math.PI*2, vy: 1 - 2*u};
  };
  const look = lookOf(trial || bank.eq), p0 = at(sec);
  if (look.trail !== 'none') drawTrail(look.trail, (k, dt) => { const q = at(sec - k*dt); return {x: x0 - k*dt*V, y: gy - q.y, o: {...q, t: now, face: 1}}; }, look);
  drawHero(x0, gy - p0.y, {...p0, t: now, face: 1}, look);
  c = mainCtx;
}

let lastUi = 0;
setInterval(() => { if (st.run || Date.now() - lastUi > 1000) { ui(); lastUi = Date.now(); } }, 250);
resize(); ui(); if (st.run) lockWake();
requestAnimationFrame(frame);
})();
</script>
