<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日の勉強</title>
<style>
:root{--bg:#fff;--fg:#000;--mut:#8e8e93;--cir:#f2f2f7;--line:#d1d1d6;--org:#ff9500;--gt:#1f9d3a;--gb:#d9f2df;--rt:#e5362b;--rb:#fde2df;--bar:#e5e5ea;--segon:#fff;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--cir:#1c1c1e;--line:#2c2c2e;--org:#ff9f0a;--gt:#30d158;--gb:#0c2a14;--rt:#ff453a;--rb:#3a100d;--bar:#2c2c2e;--segon:#000}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--cir:#1c1c1e;--line:#2c2c2e;--org:#ff9f0a;--gt:#30d158;--gb:#0c2a14;--rt:#ff453a;--rb:#3a100d;--bar:#2c2c2e;--segon:#000}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:-apple-system,"SF Pro Display","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{display:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:disabled{opacity:.4;cursor:default}
.tabs{display:flex;gap:2px;align-self:center;margin:12px 0 0;padding:3px;border-radius:999px;background:var(--cir)}
.tabs button{border:0;background:none;padding:8px 18px;border-radius:999px;font-weight:500;font-size:16px}
.tabs .on{background:var(--segon);color:var(--org)}
#pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pg{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;display:flex;flex-direction:column;padding:0 20px 16px;scrollbar-width:none}
.dig{font-weight:200;font-variant-numeric:tabular-nums;font-size:clamp(56px,17vw,180px);text-align:center;line-height:1;margin:5vh 0 2vh;white-space:nowrap}
.dig.lg{font-size:clamp(44px,12.5vw,140px)}
.disp{display:grid;justify-items:center;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.disp .an,.disp .dig{grid-area:1/1}
.an{display:block;width:min(66vw,40vh,340px);padding-top:3vh;max-height:0;opacity:0;transform:scale(.94);pointer-events:none;color:var(--fg);transition:opacity .4s ease,max-height .4s ease,transform .4s ease}
.disp .dig{max-height:220px;transition:opacity .4s ease,max-height .4s ease,margin .4s ease,transform .4s ease}
.an svg{width:100%;height:auto;display:block}
.disp[data-v="1"] .an{max-height:420px;opacity:1;transform:none;pointer-events:auto}
.disp[data-v="1"] .dig{max-height:0;margin:0;opacity:0;transform:scale(.94);pointer-events:none}
.dots{grid-area:2/1;justify-self:center;display:flex;gap:10px;border:0;background:none;padding:12px 20px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);opacity:.5}
.dots i.on{background:var(--fg);opacity:1}
.tot{text-align:center;color:var(--mut);font-size:17px}
.tot b{color:var(--fg);font-weight:600}
.gs{max-width:560px;width:100%;margin:14px auto 0}
.gr{border-top:1px solid var(--line);padding:10px 0}
.gr .t{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.gr .nm{color:var(--mut);flex:1}
.bar{height:4px;background:var(--bar);border-radius:2px;margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--org)}
.gv{font-size:16px;min-height:1.2em}
.ok{color:var(--gt)}.ng{color:var(--rt)}
.ctl{display:grid;grid-template-columns:100px 1fr 100px;align-items:center;gap:16px;margin-top:auto;padding-top:18px}
.cir{width:96px;height:96px;border-radius:50%;border:0;background:var(--cir);font-size:17px}
.cir.go{background:var(--gb);color:var(--gt)}
.cir.stop{background:var(--rb);color:var(--rt)}
.mid{display:flex;flex-direction:column;gap:10px;align-items:center}
.pill{border:0;border-radius:999px;background:var(--cir);padding:11px 28px}
.tbl{max-height:38vh;overflow-y:auto}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.row.h{color:var(--mut)}
.row span:nth-child(2){text-align:center}.row span:last-child{text-align:right}
.fast{color:var(--gt)}.slow{color:var(--rt)}
.svs{max-width:720px;width:100%;margin:28px auto 0}
.svs h3{font-size:15px;font-weight:500;color:var(--mut);margin:0 0 8px}
.sv{background:var(--cir);border-radius:16px;padding:12px 16px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.sv .top{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;cursor:pointer}
.chev{color:var(--mut)}
.sv p{color:var(--mut);font-size:14px;margin:10px 0 0}
.row input{min-width:0;width:100%;background:none;border:0;border-bottom:1px dashed var(--line);padding:2px 0;font-size:inherit}
.sv .big{font-size:22px;font-weight:300}
.sv input{font-size:17px}
.sv summary{color:var(--mut);font-size:14px;margin:8px 0;cursor:pointer}
.sv input{min-width:0;background:none;border:0;border-bottom:1px dashed var(--line);padding:4px 0}
.x{border:0;background:none;color:var(--mut);font-size:14px}
.gp2{width:100%;max-width:480px;margin:0 auto}
.gp2 h2{font-weight:600;font-size:22px;margin:3vh 0 6px}
.note{color:var(--mut);margin:0 0 16px;line-height:1.5}
.grow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.grow label{display:flex;align-items:center;gap:6px;color:var(--mut)}
.grow input{width:64px;border:0;border-radius:10px;background:var(--cir);padding:10px;font-size:22px;text-align:center;color:var(--fg)}
.grow .nmi{width:100%;min-width:0;text-align:left;font-size:17px;background:none;border-bottom:1px dashed var(--line);border-radius:0;padding:6px 0}
.pk{padding:10px 16px}
.exam{margin-top:28px;border-top:1px solid var(--line);padding-top:8px}
.exam h3{font-size:17px;font-weight:600;margin:12px 0 10px}
.erow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:10px}
.erow input{border:0;background:var(--cir);border-radius:10px;padding:10px;font-size:17px;color:var(--fg);min-width:0}
.cd{position:sticky;top:0;z-index:2;background:var(--bg);text-align:center;font-size:20px;padding:10px 0 6px}
.cd.un{color:var(--mut);font-size:15px}
.cd b{font-size:30px;font-weight:600;color:var(--org);font-variant-numeric:tabular-nums}
.cd:empty{display:none}
.grow.on .pk{background:var(--gb);color:var(--gt);font-weight:600}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:20px}
#ov.on{display:flex}
.box{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:360px;text-align:center}
.box p{color:var(--mut);font-size:14px;margin:8px 0 16px}
.adj{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.adj button{border:0;border-radius:14px;background:var(--cir);padding:14px 0;font-size:18px}
@media (max-width:520px){.cir{width:80px;height:80px;font-size:16px}.ctl{grid-template-columns:80px 1fr 80px;gap:10px}.tabs button{padding:8px 12px;font-size:14px}}
@media (prefers-reduced-motion:reduce){#pager{scroll-behavior:auto}.an,.disp .dig{transition:none}}
</style>
</head>
<body>
<nav class="tabs" aria-label="画面">
<button data-act="tab" data-i="0">勉強</button>
<button data-act="tab" data-i="1">ストップウォッチ</button>
<button data-act="tab" data-i="2">目標</button>
</nav>
<main id="pager"></main>
<div id="ov"><div class="box">
<div>今日の合計 <b data-k="total"></b></div>
<p>ストップウォッチの時間を増減します。</p>
<div class="adj">
<button data-act="adj" data-v="-600000">−10分</button>
<button data-act="adj" data-v="600000">+10分</button>
<button data-act="adj" data-v="-60000">−1分</button>
<button data-act="adj" data-v="60000">+1分</button>
</div>
<button class="pill" data-act="adjclose">閉じる</button>
</div></div>
<script>
const day=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const fresh=()=>({d:day(),rec:0,acc:0,run:false,t0:0,sel:null,sw:{acc:0,run:false,t0:0,laps:[]},saved:[]});
let S;
try{S=JSON.parse(localStorage.getItem('study-day'));if(!S||S.d!==day())S=fresh()}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem('study-day',JSON.stringify(S))}catch(e){}};
let PR;try{PR=JSON.parse(localStorage.getItem('study-presets'))}catch(e){}
if(!Array.isArray(PR)||PR.length!=4)PR=[{n:'部活の日',m:300},{n:'休みの日',m:600},{n:'パターン3',m:null},{n:'パターン4',m:null}];
const savePR=()=>{try{localStorage.setItem('study-presets',JSON.stringify(PR))}catch(e){}};
let VW={m:0,s:0};try{Object.assign(VW,JSON.parse(localStorage.getItem('study-view')))}catch(e){}
let EX={n:'共通テスト',d:''};try{Object.assign(EX,JSON.parse(localStorage.getItem('study-exam')))}catch(e){}
const fillEX=()=>{document.querySelectorAll('[data-en]').forEach(x=>x.value=EX.n);document.querySelectorAll('[data-ed]').forEach(x=>x.value=EX.d)};
const p=n=>String(n).padStart(2,'0');
const fmtT=ms=>{ms=Math.max(0,ms);const h=Math.floor(ms/36e5);return(h?h+':':'')+p(Math.floor(ms/6e4)%60)+':'+p(Math.floor(ms/1e3)%60)+'.'+p(Math.floor(ms/10)%100)};
const fmtHS=ms=>{const s=Math.floor(ms/1e3),h=Math.floor(s/3600),m=Math.floor(s/60)%60;return h?h+'時間'+m+'分':m+'分'+(s%60)+'秒'};
const hm=min=>{const h=Math.floor(min/60),m=min%60;return h?h+'時間'+(m?m+'分':''):m+'分'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el=o=>o.acc+(o.run?Date.now()-o.t0:0);
const tog=o=>{const e=el(o);if(o.run){o.acc=e;o.run=false}else{o.t0=Date.now();o.run=true}};
const q=(k,f)=>document.querySelectorAll('[data-k='+k+']').forEach(f);

const P=document.getElementById('pager');
const dialSVG=w=>{let t='';
for(let i=0;i<60;i++){const a=i*6*Math.PI/180,l=i%5?4:8,r=94,s=Math.sin(a),c=Math.cos(a);t+=`<line x1="${(100+r*s).toFixed(1)}" y1="${(100-r*c).toFixed(1)}" x2="${(100+(r-l)*s).toFixed(1)}" y2="${(100-(r-l)*c).toFixed(1)}" stroke="currentColor" stroke-width="${i%5?.8:1.6}" opacity="${i%5?.5:1}"/>`}
for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;t+=`<text x="${(100+76*Math.sin(a)).toFixed(1)}" y="${(100-76*Math.cos(a)+4).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="300" fill="currentColor">${i*5}</text>`}
const sub=(cy,lab)=>{let s=`<circle cx="100" cy="${cy}" r="24" fill="none" stroke="var(--line)"/><text x="70" y="${cy+3}" text-anchor="end" font-size="8" fill="var(--mut)">${lab}</text>`;for(let i=0;i<12;i++){const a=i*30*Math.PI/180;s+=`<line x1="${(100+24*Math.sin(a)).toFixed(1)}" y1="${(cy-24*Math.cos(a)).toFixed(1)}" x2="${(100+20*Math.sin(a)).toFixed(1)}" y2="${(cy-20*Math.cos(a)).toFixed(1)}" stroke="currentColor" stroke-width="1"/>`}return s};
const ext=(cy,n,nums)=>{let s='';
for(let i=0;i<n;i++){if(i%5==0)continue;const a=i*6*Math.PI/180;s+=`<line x1="${(100+24*Math.sin(a)).toFixed(1)}" y1="${(cy-24*Math.cos(a)).toFixed(1)}" x2="${(100+22*Math.sin(a)).toFixed(1)}" y2="${(cy-22*Math.cos(a)).toFixed(1)}" stroke="currentColor" stroke-width=".6" opacity=".5"/>`}
nums.forEach(([v,d])=>{const a=d*Math.PI/180;s+=`<text x="${(100+14.5*Math.sin(a)).toFixed(1)}" y="${(cy-14.5*Math.cos(a)+2.3).toFixed(1)}" text-anchor="middle" font-size="6.5" fill="currentColor">${v}</text>`});return s};
t+=sub(66,'分')+sub(134,'時間')+ext(66,60,[[10,60],[20,120],[30,180],[40,240],[50,300],[60,0]])+ext(134,0,[[3,90],[6,180],[9,270],[12,0]]);
t+=`<g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line data-h="m" x1="100" y1="66" x2="100" y2="48"/><line data-h="h" x1="100" y1="134" x2="100" y2="116"/></g><g stroke="var(--org)" fill="var(--org)"><line data-h="s" x1="100" y1="114" x2="100" y2="8" stroke-width="1.6" stroke-linecap="round"/><circle cx="100" cy="100" r="3.5"/></g>`;
return `<svg viewBox="0 0 200 200" data-w="${w}" role="img" aria-label="アナログ表示">${t}</svg>`};
const disp=(w,k)=>`<div class="disp" data-k="vm" data-w="${w}"><div class="an">${dialSVG(w)}</div><div class="dig" data-k="${k}">00:00.00</div><button class="dots" data-act="vw" data-w="${w}" aria-label="デジタルとアナログの切り替え"><i></i><i></i></button></div>`;
const mainHTML=`<section class="pg"><div class="cd" data-k="cd"></div>${disp('m','mt')}
<div class="tot">今日の合計 <b data-k="total"></b></div>
<div class="gs"><div class="gr"><div class="t"><span class="nm"></span><span class="gt"></span><span class="gpc"></span></div><div class="bar"><i></i></div><div class="gv"></div></div></div>
<div class="ctl"><button class="cir" data-act="reset" data-k="mr">リセット</button>
<div class="mid"><button class="pill" data-act="adjopen">修正</button><button class="pill" data-act="rec" data-k="mrec">記録する</button></div>
<button class="cir go" data-act="toggle" data-k="mb">開始</button></div></section>`;
const swHTML=`<section class="pg">${disp('s','st')}
<div style="text-align:center"><button class="pill" data-act="swsave" data-k="ssave">保存</button></div>
<div class="ctl" style="align-items:start;margin-top:16px"><button class="cir" data-act="swlap" data-k="sl">ラップ</button>
<div class="tbl" data-k="tbl"></div>
<button class="cir go" data-act="swtoggle" data-k="sb">開始</button></div>
<div class="svs" data-k="svs"></div></section>`;
const goalHTML=`<section class="pg"><div class="gp2"><h2>今日の目標を選ぶ</h2>
<p class="note" data-k="note"></p>
${[0,1,2,3].map(i=>`<div class="grow" data-i="${i}"><input class="nmi" data-pn maxlength="12" aria-label="名前"><label><input type="number" inputmode="numeric" min="0" max="24" data-u="h" aria-label="時間">時間</label><label><input type="number" inputmode="numeric" min="0" max="59" data-u="m" aria-label="分">分</label><button class="pill pk" data-act="pick" data-i="${i}">選ぶ</button></div>`).join('')}
<div class="exam"><h3>試験日までのカウントダウン</h3><div class="erow"><input data-en maxlength="12" placeholder="共通テスト" aria-label="試験の名前"><input type="date" data-ed aria-label="試験日"></div><p class="note" data-k="ecd"></p></div>
</div></section>`;
P.innerHTML=mainHTML+swHTML+goalHTML;
const base=[...P.children];
for(let c=1;c<5;c++)base.forEach(n=>P.append(n.cloneNode(true)));
// 15ページ(勉強→ストップウォッチ→目標を 5 周)。端に近づいたら真ん中の周へ張り替える
const L=Array.from({length:15},(_,i)=>i%3);

function fillGoals(){document.querySelectorAll('.grow').forEach(r=>{const g=PR[r.dataset.i].m;r.querySelector('[data-pn]').value=PR[r.dataset.i].n;r.querySelector('[data-u=h]').value=g==null?'':Math.floor(g/60);r.querySelector('[data-u=m]').value=g==null?'':g%60})}
const lapRows=(laps,ns,key)=>{ns=ns||[];const sp=laps.map((l,i)=>l-(laps[i-1]||0));const mx=Math.max(...sp),mn=Math.min(...sp);let h='';
for(let i=laps.length-1;i>=0;i--){const c=laps.length>1&&mx>mn?(sp[i]==mx?' slow':sp[i]==mn?' fast':''):'';h+=`<div class="row${c}"><span><input data-ln="${i}" data-src="${key}" placeholder="ラップ ${i+1}" aria-label="ラップの名前" value="${esc(ns[i]||'')}"></span><span>${fmtT(sp[i])}</span><span>${fmtT(laps[i])}</span></div>`}return h};
const lapHead='<div class="row h"><span>ラップ数</span><span>スプリット</span><span>合計</span></div>';
function renderLists(){
const W=S.sw,L0=W.laps;
const live=(W.run||W.acc>0||L0.length)?`<div class="row"><span><input data-ln="${L0.length}" data-src="w" placeholder="ラップ ${L0.length+1}" aria-label="ラップの名前" value="${esc((W.ln||[])[L0.length]||'')}"></span><span data-k="ls">00:00.00</span><span data-k="lt">00:00.00</span></div>`:'';
q('tbl',n=>n.innerHTML=lapHead+live+lapRows(S.sw.laps,S.sw.ln,'w'));
let h='';
if(S.saved.length){h='<h3>保存した記録</h3>'+S.saved.map((s,i)=>`<div class="sv"><div class="top" data-act="exp" data-i="${i}"><span class="chev">${s.o?'▾':'▸'}</span><input data-sv="${i}" value="${esc(s.n)}" aria-label="記録の名前"><span class="big">${fmtT(s.ms)}</span><button class="x" data-act="del" data-i="${i}">削除</button></div>${s.o?(s.laps&&s.laps.length?lapHead+lapRows(s.laps,s.ln,i):'<p>ラップはありません</p>'):''}</div>`).join('')}
q('svs',n=>n.innerHTML=h);
}
function render(){
const now=Date.now(),e=el(S),tot=S.rec+e,w=el(S.sw),W=S.sw;
const nd=new Date();nd.setHours(24,0,0,0);const left=nd-now;
q('mt',n=>{n.textContent=fmtT(e);n.classList.toggle('lg',e>=36e5)});
q('total',n=>n.textContent=fmtHS(tot));
q('mb',n=>{n.textContent=S.run?'停止':'開始';n.className='cir '+(S.run?'stop':'go')});
q('mr',n=>n.disabled=S.run||e==0);
q('mrec',n=>n.disabled=e==0);
document.querySelectorAll('.gr').forEach(r=>{
const g=S.sel==null?null:PR[S.sel].m;r.querySelector('.nm').textContent=S.sel==null?'今日の目標':PR[S.sel].n;const gt=r.querySelector('.gt'),gp=r.querySelector('.gpc'),bar=r.querySelector('i'),gv=r.querySelector('.gv');
if(!g){gt.textContent='未設定';gp.textContent='';bar.style.width='0';gv.textContent='';gv.className='gv';return}
const gms=g*6e4,rate=tot/gms*100,rem=gms-tot;
gt.textContent=hm(g);gp.textContent=Math.floor(rate)+'%';bar.style.width=Math.min(100,rate)+'%';
if(rem<=0){gv.textContent='達成済み';gv.className='gv ok'}
else if(rem<=left){gv.textContent='24時までに達成できる（あと'+hm(Math.ceil(rem/6e4))+'）';gv.className='gv ok'}
else{gv.textContent='24時までに達成できない（'+hm(Math.ceil((rem-left)/6e4))+'不足）';gv.className='gv ng'}
});
q('st',n=>{n.textContent=fmtT(w);n.classList.toggle('lg',w>=36e5)});
q('sb',n=>{n.textContent=W.run?'停止':'開始';n.className='cir '+(W.run?'stop':'go')});
q('sl',n=>{if(W.run){n.textContent='ラップ';n.dataset.act='swlap';n.disabled=false}else if(w>0){n.textContent='リセット';n.dataset.act='swreset';n.disabled=false}else{n.textContent='ラップ';n.dataset.act='swlap';n.disabled=true}});
q('ssave',n=>n.disabled=w==0);
q('ls',n=>n.textContent=fmtT(w-(W.laps.length?W.laps[W.laps.length-1]:0)));
q('lt',n=>n.textContent=fmtT(w));
const td0=new Date(),ex=EX.d?Math.round((new Date(EX.d+'T00:00:00')-new Date(td0.getFullYear(),td0.getMonth(),td0.getDate()))/864e5):null,en=esc(EX.n||'試験');
const unset=ex==null||isNaN(ex),cdh=unset?'目標の画面で試験日を設定できます':ex<0?en+'は終了しました':ex==0?en+'当日':en+'まで あと <b>'+ex+'</b> 日';
q('cd',n=>{n.classList.toggle('un',unset);if(n.dataset.v!==cdh){n.dataset.v=cdh;n.innerHTML=cdh}});
q('ecd',n=>n.textContent=ex==null||isNaN(ex)?'日付を選ぶと、勉強画面に日数が出ます。':ex<0?'試験日は過ぎています。':ex==0?'今日が試験日です。':(EX.n||'試験')+'まであと'+ex+'日です。');
q('vm',n=>{const v=VW[n.dataset.w];n.dataset.v=v;n.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i==v))});
document.querySelectorAll('.an svg').forEach(sv=>{const ms=sv.dataset.w=='m'?e:w;const set=(k,d,cx,cy)=>sv.querySelector('[data-h='+k+']').setAttribute('transform','rotate('+d+' '+cx+' '+cy+')');set('s',ms%6e4/1e3*6,100,100);set('m',ms/6e4%60*6,100,66);set('h',ms/36e5%12*30,100,134)});
q('note',n=>n.textContent=S.sel==null?'今日の目標を1つ選んでください。名前と時間は書き換えられ、明日以降も残ります。':'名前と時間は書き換えられます。選び直すこともできます。');
document.querySelectorAll('.grow').forEach(r=>{const i=+r.dataset.i,b=r.querySelector('.pk');r.classList.toggle('on',S.sel===i);b.textContent=S.sel===i?'選択中':'選ぶ';b.disabled=!(PR[i].m>0)});
}
let T;
function loop(){
if(day()!==S.d){S=fresh();fillGoals();renderLists();jump(8)}
render();T=setTimeout(loop,(S.run||S.sw.run)?50:1000);
}
const kick=()=>{clearTimeout(T);loop()};

// swipe loop
const idx=()=>Math.round(P.scrollLeft/P.clientWidth);
const go=(i,sm=true)=>P.scrollTo({left:P.clientWidth*i,behavior:sm?'smooth':'auto'});
let cur=1,tch=false,tm;
function jump(i){P.style.scrollSnapType='none';P.scrollLeft=P.clientWidth*i;cur=i;setTab(L[i]);requestAnimationFrame(()=>P.style.scrollSnapType='')}
function setTab(l){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.i===l))}
function fix(){
if(tch)return;
const j=idx(),w=P.clientWidth;
if(Math.abs(P.scrollLeft-j*w)>2){tm=setTimeout(fix,120);return}
cur=j;
if(j<=3||j>=11)jump(6+j%3);
}
P.addEventListener('scroll',()=>{setTab(L[idx()]);clearTimeout(tm);tm=setTimeout(fix,150)},{passive:true});
P.addEventListener('touchstart',()=>{tch=true},{passive:true});
['touchend','touchcancel'].forEach(t=>P.addEventListener(t,()=>{tch=false;clearTimeout(tm);tm=setTimeout(fix,250)},{passive:true}));
addEventListener('resize',()=>jump(cur));

// actions
document.addEventListener('click',ev=>{
const b=ev.target.closest('[data-act]');
if(!b||b.disabled||ev.target.closest('input'))return;
const W=S.sw,a=b.dataset.act;
if(a=='tab'){const l=+b.dataset.i,c=idx(),d=(l-c%3+3)%3;go(c+(d==2?-1:d));return}
if(a=='toggle')tog(S);
else if(a=='reset'){S.acc=0;S.run=false}
else if(a=='rec'){S.rec+=el(S);S.acc=0;if(S.run)S.t0=Date.now()}
else if(a=='adjopen'){document.getElementById('ov').classList.add('on')}
else if(a=='adjclose'){document.getElementById('ov').classList.remove('on')}
else if(a=='adj'){let n=el(S)+(+b.dataset.v);if(n<0){S.rec=Math.max(0,S.rec+n);n=0}S.acc=n;if(S.run)S.t0=Date.now()}
else if(a=='swtoggle')tog(W);
else if(a=='swlap')W.laps.push(el(W));
else if(a=='swreset'){W.acc=0;W.run=false;W.laps=[];W.ln=[]}
else if(a=='swsave'){const e=el(W);if(e>0)S.saved.unshift({n:'記録 '+(S.saved.length+1),ms:e,laps:(W.laps.length&&e>W.laps[W.laps.length-1]?W.laps.concat(e):W.laps.slice()),ln:(W.ln||[]).slice()})}
else if(a=='vw'){VW[b.dataset.w]^=1;try{localStorage.setItem('study-view',JSON.stringify(VW))}catch(e){}}
else if(a=='exp'){const s=S.saved[+b.dataset.i];s.o=!s.o}
else if(a=='del')S.saved.splice(+b.dataset.i,1);
else if(a=='pick'){S.sel=+b.dataset.i;save();kick();go(idx()+1);return}
save();renderLists();kick();
});
document.addEventListener('input',ev=>{
const t=ev.target;
if(t.dataset.en!=null||t.dataset.ed!=null){const k=t.dataset.en!=null?'n':'d';EX[k]=t.value;document.querySelectorAll(k=='n'?'[data-en]':'[data-ed]').forEach(x=>{if(x!==t)x.value=t.value});try{localStorage.setItem('study-exam',JSON.stringify(EX))}catch(x){}render();return}
if(t.dataset.sv!=null){S.saved[+t.dataset.sv].n=t.value;save();document.querySelectorAll('[data-sv="'+t.dataset.sv+'"]').forEach(x=>{if(x!==t)x.value=t.value});return}
if(t.dataset.ln!=null){const o=t.dataset.src=='w'?S.sw:S.saved[+t.dataset.src];(o.ln||(o.ln=[]))[+t.dataset.ln]=t.value;save();document.querySelectorAll('[data-ln="'+t.dataset.ln+'"][data-src="'+t.dataset.src+'"]').forEach(x=>{if(x!==t)x.value=t.value});return}
if(t.dataset.u||t.dataset.pn!=null){
const row=t.closest('.grow'),i=+row.dataset.i;
const hi=row.querySelector('[data-u=h]'),mi=row.querySelector('[data-u=m]'),ni=row.querySelector('[data-pn]');
const any=hi.value!==''||mi.value!=='';
PR[i]={n:ni.value,m:any?Math.min(1440,(+hi.value||0)*60+(+mi.value||0)):null};
document.querySelectorAll('.grow[data-i="'+i+'"]').forEach(r=>{if(r!==row){r.querySelector('[data-u=h]').value=hi.value;r.querySelector('[data-u=m]').value=mi.value;r.querySelector('[data-pn]').value=ni.value}});
savePR();render();
}
});

fillGoals();renderLists();
fillEX();
let sx=0,sy=0,sd=null;
document.addEventListener('pointerdown',e=>{if(e.pointerType!='mouse')return;sd=e.target.closest('.disp');sx=e.clientX;sy=e.clientY});
document.addEventListener('pointercancel',()=>{sd=null});
document.addEventListener('pointerup',e=>{const d=sd;sd=null;if(!d)return;const dx=e.clientX-sx,dy=e.clientY-sy;
if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.5){VW[d.dataset.w]^=1;try{localStorage.setItem('study-view',JSON.stringify(VW))}catch(x){}render()}});
let td=null,tx=0,ty=0,tmode=null;
const toggleView=w=>{VW[w]^=1;try{localStorage.setItem('study-view',JSON.stringify(VW))}catch(x){}render()};
document.addEventListener('touchstart',e=>{td=e.target.closest('.disp');tmode=null;if(td){tx=e.touches[0].clientX;ty=e.touches[0].clientY}},{passive:true});
document.addEventListener('touchmove',e=>{if(!td||tmode=='v')return;const t=e.touches[0],dx=t.clientX-tx,dy=t.clientY-ty;
if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)*1.5){tmode='v';return}
if(Math.abs(dx)>6)tmode='h';
if(e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('touchend',e=>{const d=td,m=tmode;td=null;if(!d||m!='h')return;if(Math.abs(e.changedTouches[0].clientX-tx)>40)toggleView(d.dataset.w)},{passive:true});
document.addEventListener('touchcancel',()=>{td=null});
requestAnimationFrame(()=>{jump(S.sel==null?8:6);loop()});
</script>
</body>
</html>
